<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0F1117" />
<title>Forge &bull; Your Result</title>
<meta name="description" content="Your Forge personality result: archetype, strengths, careers, relationships, and more." />
<link rel="canonical" href="https://yota321.github.io/PersonaForge/result" />
<meta name="robots" content="noindex" />
<link rel="icon" type="image/svg+xml" href="assets/Icon_black.svg" media="(prefers-color-scheme: light)" />
<link rel="icon" type="image/svg+xml" href="assets/Icon_white.svg" media="(prefers-color-scheme: dark)" />
<link rel="icon" type="image/png" href="assets/Icon_black_192.png" />
<link rel="apple-touch-icon" href="assets/Icon_white_512.png" />
<link rel="manifest" href="manifest.json" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://api.fontshare.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@400,500,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/pages.css">
</head>
<body>
<div id="embers" aria-hidden="true"></div>
<div id="app"></div>
<audio id="bgMusic" src="assets/BG.mp3" loop preload="auto"></audio>
<div class="scrollbar-rail" id="sbRail" aria-hidden="true">
  <div class="scrollbar-track" id="sbTrack"></div>
  <div class="scrollbar-thumb" id="sbThumb"></div>
</div>

<script src="js/engine.js"></script>
<script src="js/global.js"></script>
<script src="js/compatibility.js"></script>
<script src="js/result.js"></script>
<script>
const PF_PAGE = "result";
applyTheme(currentTheme);
useCleanURL("result");
(function boot(){
  const freshResult = sessionStorage.getItem("pf_fresh_result");
  if (freshResult){
    sessionStorage.removeItem("pf_fresh_result");
    try{
      lastResult = JSON.parse(freshResult);
      careersExpanded = false; funStatsOpen = false;
      renderResult();
      fireConfetti();
      return;
    } catch(e){ /* fall through */ }
  }
  const viewSharedCode = sessionStorage.getItem("pf_view_shared_code");
  if (viewSharedCode){
    sessionStorage.removeItem("pf_view_shared_code");
    const decoded = decodeCode(viewSharedCode);
    if (decoded){
      lastResult = buildResultFromDecoded(decoded, viewSharedCode);
      careersExpanded = false; funStatsOpen = false;
      renderResult();
      return;
    }
  }
  // A result page reloaded, bookmarked, or reopened from a copied address
  // bar URL carries no sessionStorage (that's a one-shot handoff from
  // index.html/the quiz) but DOES still carry setShareableURL()'s own
  // ?code= query param, so this is the difference between "reloading
  // your own result" working and silently bouncing to the landing page.
  const urlCode = getProfileCodeFromURL();
  if (urlCode){
    const decoded = decodeCode(urlCode);
    if (decoded){
      lastResult = buildResultFromDecoded(decoded, urlCode);
      careersExpanded = false; funStatsOpen = false;
      renderResult();
      return;
    }
  }
  location.href = "index.html";
})();
</script>
</body>
</html>
