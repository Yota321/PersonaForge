<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PersonaForge, Decode Yourself</title>
<meta name="description" content="PersonaForge: an adaptive, scenario-based personality test with a noir aesthetic. 100%% client-side, no accounts, works offline." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* =========================================================================
   PERSONAFORGE, DESIGN SYSTEM (NOIR)
   Near black and white, one restrained red accent, film grain, a vignette,
   and slow venetian-blind light bars behind the hero. Sharper corners than
   a typical soft-glass app, closer to a printed case file than a game UI.
   ========================================================================= */

:root{
  --bg: #050505;
  --bg-alt: #0A0A0A;
  --surface: rgba(255,255,255,0.035);
  --surface-strong: rgba(255,255,255,0.06);
  --border: rgba(255,255,255,0.11);
  --border-strong: rgba(255,255,255,0.22);
  --text: #EDEAE3;
  --text-muted: #9A968D;
  --text-dim: #5C584F;
  --accent: #B3242B;
  --accent-soft: #D9635B;
  --silver: #C9C6BC;
  --good: #7A9A7E;
  --radius-sm: 4px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --radius-xl: 18px;
  --shadow-soft: 0 24px 60px -20px rgba(0,0,0,0.75);
  --ease: cubic-bezier(.22,1,.36,1);
  --font-display: 'Space Grotesk', 'Arial Narrow', sans-serif;
  --font-body: 'Manrope', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', 'Courier New', monospace;
}

@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{ animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
}

*{ box-sizing: border-box; margin:0; padding:0; }
html{ scroll-behavior: smooth; }
body{
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  min-height: 100vh;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  position: relative;
}

/* film grain, fixed, cheap, no image asset */
body::before{
  content:''; position:fixed; inset:-100px; z-index: 2000; pointer-events:none;
  opacity: 0.05; mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
}
/* vignette */
body::after{
  content:''; position:fixed; inset:0; z-index: 1999; pointer-events:none;
  background: radial-gradient(120% 90% at 50% 20%, rgba(0,0,0,0) 40%, rgba(0,0,0,0.55) 100%);
}

::selection{ background: var(--accent); color:#0A0505; }

a{ color: inherit; }
button{ font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
button:focus-visible, [tabindex]:focus-visible, input:focus-visible, textarea:focus-visible{
  outline: 1px solid var(--silver); outline-offset: 3px;
}

h1,h2,h3,h4{ font-family: var(--font-display); font-weight: 600; letter-spacing: -0.01em; }

.container{ max-width: 880px; margin: 0 auto; padding: 0 22px; position:relative; z-index:1; }
.screen{ min-height: 100vh; display:flex; flex-direction:column; padding: 32px 0 64px; }

/* ---------- Venetian blind light bars (decorative, aria-hidden) ---------- */
#embers{ position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; opacity:0.5; }
.blind-bar{
  position:absolute; left:-10%; width:120%; height:14px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05) 40%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.05) 60%, transparent);
  transform: rotate(-3deg);
  animation: drift 22s ease-in-out infinite;
}
@keyframes drift{ 0%,100%{ transform: rotate(-3deg) translateX(0); } 50%{ transform: rotate(-3deg) translateX(2%); } }

/* ---------- Surfaces ---------- */
.glass{
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
}

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding: 13px 26px; border-radius: var(--radius-sm); font-weight: 600; font-size: 14.5px;
  letter-spacing: 0.01em;
  transition: transform .2s var(--ease), box-shadow .2s var(--ease), background .2s var(--ease), border-color .2s var(--ease);
  border: 1px solid transparent;
}
.btn-primary{
  background: var(--text); color: #0A0808;
  box-shadow: 0 10px 30px -12px rgba(0,0,0,0.7);
}
.btn-primary:hover{ transform: translateY(-1px); background: #FFFDF8; }
.btn-primary:active{ transform: translateY(0) scale(.98); }
.btn-ghost{
  background: var(--surface); border:1px solid var(--border); color: var(--text);
}
.btn-ghost:hover{ background: var(--surface-strong); border-color: var(--border-strong); }
.btn-accent{ background: var(--accent); color:#FBEAE9; }
.btn-accent:hover{ background: var(--accent-soft); transform: translateY(-1px); }
.btn:disabled{ opacity:.35; cursor:not-allowed; transform:none !important; }

.eyebrow{
  font-family: var(--font-mono); font-size: 11.5px; letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--text-dim); display:flex; align-items:center; gap:8px;
}
.eyebrow::before{ content:''; width:5px; height:5px; background: var(--accent); }
.eyebrow.accent{ color: var(--accent-soft); }

/* ---------- Landing ---------- */
.landing{ position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; text-align:center; justify-content:center; flex:1; gap: 26px; padding-top: 6vh; }
.logo-mark{ font-family: var(--font-mono); font-size: 13px; letter-spacing:0.3em; color: var(--text-dim); text-transform:uppercase; }
.landing h1{
  font-size: clamp(46px, 9vw, 94px); line-height: 0.95; letter-spacing: -0.02em;
  color: var(--text);
  animation: revealIn 1s var(--ease) both;
}
.landing h1 span{ color: var(--accent); }
@keyframes revealIn{
  0%{ filter: blur(10px); opacity:0; transform: translateY(10px); }
  100%{ filter: blur(0); opacity:1; transform:none; }
}
.landing .tagline{ font-size: 17px; color: var(--text-muted); max-width: 460px; }
.landing .cta-row{ display:flex; gap:14px; flex-wrap:wrap; justify-content:center; margin-top: 6px; }
.landing .meta-row{ display:flex; gap:16px; flex-wrap:wrap; justify-content:center; margin-top: 30px; color: var(--text-dim); font-size:12.5px; font-family: var(--font-mono); }

.quick-compare{ margin-top: 34px; width:100%; max-width: 480px; padding: 18px 20px; text-align:left; }
.quick-compare label{ font-size:12.5px; color: var(--text-muted); display:block; margin-bottom:8px; }
.quick-compare .row{ display:flex; gap:10px; }
.quick-compare input{
  flex:1; background: rgba(255,255,255,0.02); border:1px solid var(--border); border-radius: var(--radius-sm);
  color: var(--text); padding: 11px 13px; font-family: var(--font-mono); font-size:13px;
}

/* ---------- Name capture ---------- */
.name-screen{ position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; justify-content:center; flex:1; gap:22px; text-align:center; padding-top:8vh; }
.name-screen h2{ font-size: clamp(26px,4vw,36px); max-width:480px; }
.name-screen p{ color: var(--text-muted); max-width: 420px; }
.name-input{
  width: 100%; max-width: 380px; background: transparent; border:none; border-bottom: 2px solid var(--border-strong);
  color: var(--text); font-family: var(--font-display); font-size: 28px; text-align:center; padding: 10px 6px;
  transition: border-color .2s;
}
.name-input:focus{ outline:none; border-color: var(--accent); }
.name-input::placeholder{ color: var(--text-dim); }

/* ---------- Quiz ---------- */
.quiz-top{ position: sticky; top:0; z-index: 5; padding: 18px 0 10px; backdrop-filter: blur(14px); background: linear-gradient(to bottom, rgba(5,5,5,0.92), rgba(5,5,5,0)); }
.progress-track{ height:3px; background: rgba(255,255,255,0.08); overflow:hidden; }
.progress-fill{ height:100%; background: var(--text); transition: width .5s var(--ease); }
.progress-meta{ display:flex; justify-content:space-between; align-items:center; margin-top:12px; font-size:12.5px; color: var(--text-muted); font-family: var(--font-mono); }
.encourage{ color: var(--accent-soft); font-family: var(--font-mono); font-size: 12px; min-height: 16px; }

.question-card{ margin-top: 26px; padding: 38px clamp(20px,4vw,44px); animation: cardIn .45s var(--ease) both; }
@keyframes cardIn{ from{ opacity:0; transform: translateY(14px); } to{ opacity:1; transform:none; } }
.question-card.leaving{ animation: cardOut .28s var(--ease) forwards; }
@keyframes cardOut{ to{ opacity:0; transform: translateY(-10px); } }
.quiz-nav-row{ display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; }
.nav-btn{ font-family: var(--font-mono); font-size:12.5px; color: var(--text-muted); display:flex; align-items:center; gap:6px; }
.nav-btn:hover:not(:disabled){ color: var(--text); }
.nav-btn:disabled{ opacity:.3; cursor:default; }
.q-num{ font-family: var(--font-mono); color: var(--text-dim); font-size:12.5px; margin-bottom: 14px; }
.q-text{ font-size: clamp(21px, 3.4vw, 27px); font-family: var(--font-display); line-height:1.3; margin-bottom: 30px; font-weight:500; }
.options{ display:flex; flex-direction:column; gap: 10px; }
.option{
  text-align:left; padding: 17px 19px; border-radius: var(--radius-sm);
  border:1px solid var(--border); background: rgba(255,255,255,0.015);
  font-size: 15px; transition: border-color .2s var(--ease), background .2s var(--ease), transform .15s var(--ease);
  display:flex; align-items:center; gap:14px;
}
.option:hover{ border-color: var(--border-strong); background: rgba(255,255,255,0.04); transform: translateX(2px); }
.option .opt-key{ font-family: var(--font-mono); color: var(--text-dim); font-size:12px; width:18px; flex-shrink:0; }
.option.selected{ border-color: var(--accent); background: rgba(179,36,43,0.1); }
.option.selected .opt-key{ color: var(--accent-soft); }
.continue-row{ margin-top:18px; display:flex; justify-content:flex-end; }

/* ---------- Calculating overlay ---------- */
.calc-overlay{
  position:fixed; inset:0; z-index:50; background: rgba(5,5,5,0.85); backdrop-filter: blur(4px);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
  animation: fadeIn .2s var(--ease) both;
}
@keyframes fadeIn{ from{ opacity:0;} to{ opacity:1; } }
.calc-bars{ display:flex; gap:5px; }
.calc-bars span{ width:3px; height:22px; background: var(--text); animation: bounce 0.9s ease-in-out infinite; }
.calc-bars span:nth-child(2){ animation-delay: .12s; }
.calc-bars span:nth-child(3){ animation-delay: .24s; }
.calc-bars span:nth-child(4){ animation-delay: .36s; }
@keyframes bounce{ 0%,100%{ transform: scaleY(0.4); } 50%{ transform: scaleY(1); } }
.calc-line{ font-family: var(--font-mono); color: var(--text-muted); font-size: 13px; letter-spacing: 0.03em; }

/* ---------- Loading / forging transition ---------- */
.forging{ display:flex; flex-direction:column; align-items:center; justify-content:center; flex:1; gap: 20px; text-align:center; }
.forging .calc-bars span{ background: var(--accent); }
.forging h2{ font-size:20px; font-weight: 500; }
.forging p{ font-family: var(--font-mono); color: var(--text-muted); font-size:13px; }

/* ---------- Result page ---------- */
.result-hero{ position:relative; z-index:1; padding-top: 20px; }
.name-tag{ text-align:center; font-family: var(--font-mono); font-size: 13px; color: var(--text-muted); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 6px; }

.ingot{
  position: relative; margin: 26px auto 10px; max-width: 520px; padding: 46px 34px 38px;
  border: 1px solid var(--border-strong);
  background: linear-gradient(160deg, rgba(255,255,255,0.045), rgba(255,255,255,0.01));
  box-shadow: var(--shadow-soft);
  text-align:center; overflow:hidden;
  animation: ingotReveal .8s var(--ease) both;
}
@keyframes ingotReveal{ from{ opacity:0; transform: translateY(14px);} to{ opacity:1; transform:none; } }
.ingot::before{ content:''; position:absolute; top:0; left:0; right:0; height:2px; background: var(--accent); }
.ingot-icon{ font-size: 46px; filter: grayscale(1) contrast(1.3); opacity: 0.92; }
.archetype-eyebrow{ font-family: var(--font-mono); font-size:11px; letter-spacing:0.2em; color: var(--text-dim); text-transform:uppercase; margin-top:16px; }
.ingot-name{ font-size: clamp(34px,6.5vw,52px); margin-top:8px; letter-spacing: -0.01em; line-height:1.05; }
.ingot-title{ color: var(--text-muted); font-size:15px; margin-top:8px; font-style: italic; }
.ingot-desc{ margin-top:20px; font-size:15px; color:var(--text); line-height:1.65; }
.ingot-sub{ margin-top:16px; font-size:13.5px; color: var(--text-muted); line-height:1.6; border-top:1px solid var(--border); padding-top:16px; }
.ingot-code{
  margin-top: 24px; font-family: var(--font-mono); font-size:13px;
  color: var(--silver); background: rgba(0,0,0,0.35); border:1px dashed var(--border-strong);
  padding: 11px 14px; word-break: break-all; letter-spacing: 0.03em;
}

.section{ margin-top: 46px; }
.section-title{ font-size: 19px; margin-bottom: 16px; display:flex; flex-direction:column; gap:6px; font-weight:500; }

.grid-2{ display:grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid-3{ display:grid; grid-template-columns: repeat(3,1fr); gap: 12px; }
.grid-4{ display:grid; grid-template-columns: repeat(4,1fr); gap: 10px; }
@media (max-width: 640px){ .grid-2, .grid-3, .grid-4{ grid-template-columns: 1fr 1fr; } }

.card{ padding: 18px; border-radius: var(--radius-md); }
.card h4{ font-size:13px; color: var(--text-muted); font-weight:600; margin-bottom:8px; text-transform: uppercase; letter-spacing:0.04em; }
.card p{ font-size: 14.5px; }
.tag-list{ display:flex; flex-wrap:wrap; gap:8px; margin-top:6px; }
.tag{ font-size:12.5px; padding:5px 11px; border-radius: var(--radius-sm); background: rgba(255,255,255,0.04); border:1px solid var(--border); }

.stat-tile{ padding: 15px; border-radius: var(--radius-md); text-align:center; }
.stat-tile .stat-val{ font-family: var(--font-display); font-size: 24px; color: var(--text); }
.stat-tile .stat-label{ font-size: 10.5px; color: var(--text-muted); margin-top:3px; text-transform:uppercase; letter-spacing:.05em; }
.stat-bar-track{ height:4px; background: rgba(255,255,255,.08); margin-top:9px; overflow:hidden; }
.stat-bar-fill{ height:100%; background: var(--accent); width:0; transition: width 1s var(--ease); }

.career-row{ display:flex; align-items:center; justify-content:space-between; padding:13px 15px; border-radius: var(--radius-md); margin-bottom:8px; }
.career-row .fit-badge{ font-size:11px; font-family: var(--font-mono); padding:4px 9px; border-radius: var(--radius-sm); white-space:nowrap; }
.fit-excellent{ background: rgba(122,154,126,0.15); color:#9CC0A0; }
.fit-good{ background: rgba(201,198,188,0.12); color: var(--silver); }
.fit-avoid{ background: rgba(179,36,43,0.14); color:#DE8B87; }
.careers-toggle{ text-align:center; margin-top:8px; }
.careers-toggle button{ font-family: var(--font-mono); font-size:12.5px; color: var(--text-muted); text-decoration: underline; text-underline-offset:3px; }

.relationship-row{ display:flex; align-items:center; gap:14px; padding: 11px 0; }
.relationship-row .r-label{ width: 130px; font-size:13.5px; flex-shrink:0; }
.relationship-row .stat-bar-track{ flex:1; margin-top:0; }
.relationship-row .r-score{ width:34px; text-align:right; font-family: var(--font-mono); font-size:12.5px; color: var(--text-muted); }

canvas#radar{ display:block; margin: 0 auto; max-width:100%; }
.radar-legend{ text-align:center; font-family: var(--font-mono); font-size:11.5px; color: var(--text-dim); margin-top:10px; }

.export-row{ display:flex; gap:10px; flex-wrap:wrap; margin-top: 18px; justify-content:center; }

/* full ranking (bottom of results) */
.rank-row{ display:flex; align-items:center; gap:12px; padding: 9px 0; border-bottom: 1px solid var(--border); }
.rank-row:last-child{ border-bottom:none; }
.rank-row .rank-num{ font-family: var(--font-mono); font-size:11.5px; color: var(--text-dim); width:22px; }
.rank-row .rank-icon{ width:22px; text-align:center; filter: grayscale(1); opacity:.85; }
.rank-row .rank-name{ flex:1; font-size:13.5px; }
.rank-row.primary .rank-name{ color: var(--text); font-weight:700; }
.rank-row.primary{ background: rgba(179,36,43,0.06); margin: 0 -14px; padding: 9px 14px; border-bottom-color: transparent; }
.rank-row .rank-bar-track{ width:90px; height:3px; background: rgba(255,255,255,.08); }
.rank-row .rank-bar-fill{ height:100%; background: var(--silver); }
.rank-row.primary .rank-bar-fill{ background: var(--accent); }

/* ---------- Inline compare widget (on result page, near top) ---------- */
.compare-widget{ margin-top: 30px; padding: 20px; }
.compare-widget h4{ font-size:14px; margin-bottom:4px; }
.compare-widget p.hint{ font-size:13px; color: var(--text-muted); margin-bottom:14px; }
.compare-widget .row{ display:flex; gap:10px; flex-wrap:wrap; }
.compare-widget input{
  flex:1; min-width:220px; background: rgba(255,255,255,0.02); border:1px solid var(--border); border-radius: var(--radius-sm);
  color: var(--text); padding: 12px 13px; font-family: var(--font-mono); font-size:13px;
}

/* ---------- Compare page ---------- */
.compare-inputs{ display:grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 640px){ .compare-inputs{ grid-template-columns: 1fr; } }
.compare-inputs textarea{
  width:100%; min-height:90px; background: rgba(255,255,255,0.02); border:1px solid var(--border);
  border-radius: var(--radius-md); color: var(--text); padding: 14px; font-family: var(--font-mono); font-size:13px; resize:vertical;
}
.compare-inputs label{ font-size:13px; color: var(--text-muted); display:block; margin-bottom:8px; }

.footer-nav{ position:relative; z-index:1; display:flex; justify-content:center; gap:18px; margin-top:56px; flex-wrap:wrap; }
.footer-nav button{ font-size:13px; color: var(--text-dim); text-decoration: underline; text-underline-offset:3px; }
.footer-nav button:hover{ color: var(--text-muted); }

.top-bar{ position:relative; z-index:1; display:flex; align-items:center; justify-content:space-between; padding: 6px 0 20px; }
.brand-mini{ display:flex; align-items:center; gap:8px; font-family:var(--font-display); font-weight:600; letter-spacing:-0.01em; }
.brand-mini .dot{ width:6px; height:6px; background: var(--accent); border-radius:50%; }
.icon-btn{ width:36px; height:36px; border-radius: var(--radius-sm); display:flex; align-items:center; justify-content:center; background: var(--surface); border:1px solid var(--border); font-size:13px; }
.icon-btn:hover{ border-color: var(--border-strong); }

.hidden{ display:none !important; }
.center-note{ text-align:center; color: var(--text-muted); font-size:13.5px; margin-top: 20px; }

/* print / PDF export */
@media print{
  #embers, .top-bar, .footer-nav, .export-row, .btn, .compare-widget{ display:none !important; }
  body::before, body::after{ display:none !important; }
  body{ background: #050505; color:#EDEAE3; }
}

</style>
</head>
<body>
<div id="embers" aria-hidden="true"></div>
<div id="app"></div>

<script>
/* =========================================================================
   PERSONAFORGE, DATA MODULE
   20 hidden dimensions, an adaptive question bank (10 clusters), 30 original
   archetypes, and career/relationship reference tables.
   ========================================================================= */

const DIMENSIONS = [
  "confidence","logic","creativity","humor","adaptability","curiosity",
  "empathy","leadership","patience","drive","risk","trust","kindness",
  "discipline","socialEnergy","selfAwareness","planning","resilience",
  "optimism","independence"
];

function emptyDims(){
  const d = {};
  DIMENSIONS.forEach(k => d[k] = 0);
  return d;
}

/* ---- Question bank -----------------------------------------------------
   10 clusters x 6 questions = 60 authored scenarios. Every question has
   exactly 3 answers, each nudging 3-5 dimensions by -2..+2.
   The adaptive engine (see engine.js) guarantees the first 4 of every
   cluster (40 baseline questions), then fills the remaining 10 slots from
   the 2-3 clusters the person is trending strongest in, for 50 total.
   This structure is built to scale: add more objects to any cluster array
   and raise BASELINE_PER_CLUSTER / TOTAL_QUESTIONS in engine.js to reach
   the full 150/50 spec without changing any other code.
------------------------------------------------------------------------- */

const QUESTION_BANK = {

  social: [
    { id:"soc1", text:"You walk into a party where you know exactly one person, and they've just vanished to find a drink.", options:[
      { text:"Start a conversation with the nearest stranger", d:{socialEnergy:2,confidence:2,risk:1} },
      { text:"Find a snack table and look busy until your friend returns", d:{socialEnergy:-1,patience:1,independence:1} },
      { text:"Scan the room for someone who also looks a bit lost", d:{empathy:2,socialEnergy:1,curiosity:1} } ]},
    { id:"soc2", text:"A group chat is planning a trip and the conversation has 200 unread messages.", options:[
      { text:"Read everything, then propose a clear plan", d:{planning:2,leadership:1,logic:1} },

<script>
/* =========================================================================
   PERSONAFORGE, ENGINE MODULE
   All algorithms documented inline. Pure functions, no DOM, fully testable.
   ========================================================================= */

const CLUSTERS = Object.keys(QUESTION_BANK);
const BASELINE_PER_CLUSTER = 4;   // guaranteed questions per cluster
const TOTAL_QUESTIONS = 35;       // final quiz length this build ships with
// NOTE ON SCALING: to reach the full 150-bank / 50-served spec, add
// questions to QUESTION_BANK (more per cluster or more clusters) and raise
// TOTAL_QUESTIONS. Nothing else in this file needs to change, the
// adaptive-selection algorithm below scales automatically.

/* -------------------------------------------------------------------------
   ALGORITHM: Adaptive question selection
   1. Every cluster contributes its first BASELINE_PER_CLUSTER questions
      up front, in a shuffled cluster order, so early answers sample every
      trait area (this is what lets the engine detect emerging tendencies).
   2. After the baseline round, running "cluster affinity" is computed as
      the sum of |dimension delta| contributed by answers whose question
      belonged to that cluster, i.e. how strongly that area is resonating,
      regardless of direction.
   3. Remaining slots are filled from the two to three highest-affinity
      clusters' remaining (5th/6th) questions, the "go deeper" behavior
      the spec asks for. If a cluster has no remaining questions, the next
      highest-affinity cluster is used instead.
   4. Selection order is decided progressively (re-ranked every 5 answers)
      so it keeps adapting throughout the test, not just once.
------------------------------------------------------------------------- */

function shuffledClusters(seed){
  const arr = [...CLUSTERS];
  let s = seed;
  for (let i = arr.length - 1; i > 0; i--){
    s = (s * 9301 + 49297) % 233280;
    const j = Math.floor((s / 233280) * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

class QuizSession {
  constructor(seed = Date.now() % 100000, name = ""){
    this.seed = seed;
    this.name = name;
    this.dims = emptyDims();
    this.answers = [];              // sparse: index-aligned with this.plan, entries or null
    this.clusterAffinity = {};
    CLUSTERS.forEach(c => this.clusterAffinity[c] = 0);
    this.clusterAsked = {};
    CLUSTERS.forEach(c => this.clusterAsked[c] = 0);
    this.usedIds = new Set();
    this.order = shuffledClusters(seed);
    this.plan = this._buildBaseline();
    this.cursor = 0;
  }

  _buildBaseline(){
    const plan = [];
    for (let i = 0; i < BASELINE_PER_CLUSTER; i++){
      this.order.forEach(cluster => {
        const q = QUESTION_BANK[cluster][i];
        if (q) plan.push({ ...q, cluster });
      });
    }
    return plan;
  }

  totalLength(){ return TOTAL_QUESTIONS; }

  current(){
    if (this.cursor >= TOTAL_QUESTIONS) return null;
    if (this.cursor >= this.plan.length){
      this.plan.push(this._pickAdaptive());
    }
    return this.plan[this.cursor];
  }

  currentAnswer(){
    return this.answers[this.cursor] || null;
  }

  _pickAdaptive(){
    const ranked = [...CLUSTERS].sort((a, b) => this.clusterAffinity[b] - this.clusterAffinity[a]);
    for (const cluster of ranked){
      const bank = QUESTION_BANK[cluster];
      const nextIdx = this.clusterAsked[cluster];
      if (nextIdx < bank.length && !this.usedIds.has(bank[nextIdx].id)){
        return { ...bank[nextIdx], cluster };
      }
    }
    // fallback: any unused question anywhere
    const fallback = QUESTIONS.find(q => !this.usedIds.has(q.id));
    return fallback || QUESTIONS[0];
  }

  /* Editing an already-answered question first reverts its dimension and
     cluster-affinity contribution, then re-applies the new choice, so
     going back and changing an answer produces a fully correct result
     rather than double-counting. */
  _revert(idx){
    const prev = this.answers[idx];
    if (!prev) return;
    Object.entries(prev.d).forEach(([dim, val]) => { this.dims[dim] -= val; });
    const magnitude = Object.values(prev.d).reduce((s, v) => s + Math.abs(v), 0);
    this.clusterAffinity[prev.cluster] -= magnitude;
    this.answers[idx] = null;
  }

  answer(optionIndex){
    const q = this.current();
    if (!q) return;
    const opt = q.options[optionIndex];
    const editing = !!this.answers[this.cursor];
    if (editing){
      this._revert(this.cursor);
    } else {
      this.usedIds.add(q.id);
      this.clusterAsked[q.cluster] = (this.clusterAsked[q.cluster] || 0) + 1;
    }
    let magnitude = 0;
    Object.entries(opt.d).forEach(([dim, val]) => {
      this.dims[dim] = (this.dims[dim] || 0) + val;
      magnitude += Math.abs(val);
    });
    this.clusterAffinity[q.cluster] += magnitude;
    this.answers[this.cursor] = { questionId: q.id, cluster: q.cluster, optionIndex, text: opt.text, d: opt.d };
    this.cursor++;
  }

  goBack(){
    if (this.cursor > 0) this.cursor--;
  }

  goForward(){
    // only allowed onto a question that already has a recorded answer,
    // otherwise there's nothing to advance into without answering it
    if (this.answers[this.cursor]) this.cursor++;
  }

  canGoBack(){ return this.cursor > 0; }
  canSkipForward(){ return !!this.answers[this.cursor]; }

  progress(){ return { current: this.cursor, total: TOTAL_QUESTIONS }; }
  isComplete(){ return this.cursor >= TOTAL_QUESTIONS; }

  encouragement(){
    const remaining = TOTAL_QUESTIONS - this.cursor;
    if (remaining <= 0) return "That's everything I need.";
    if (remaining === TOTAL_QUESTIONS) return "Let's start.";
    if (remaining <= 3) return "Almost there, just a couple more.";
    if (remaining <= 5) return "A few more and I'll have a clear read.";
    if (remaining <= 10) return "Ten left. You're doing fine.";
    if (this.cursor >= 15 && this.cursor < 18) return "I'm starting to get a sense of you.";
    if (remaining <= TOTAL_QUESTIONS * 0.5) return "Good pace, keep going.";
    return "Just getting started here.";
  }

  normalizedDims(){
    // clamp to a stable -10..10 range regardless of quiz length, for the
    // encoding and archetype matching steps below.
    const out = {};
    DIMENSIONS.forEach(k => {
      out[k] = Math.max(-10, Math.min(10, Math.round(this.dims[k])));
    });
    return out;
  }
}

/* -------------------------------------------------------------------------
   ALGORITHM: Archetype matching
   Each archetype has a small "signature": 3 weighted dimensions that most
   define it. Score = sum(normalizedDim[dim] * weight) for each archetype,
   the highest score wins. This is a lightweight weighted-vector match, so
   it rewards a person for being distinctively strong in an archetype's
   core traits rather than requiring an exact 20-dimension fingerprint,
   which keeps results feeling specific without demanding improbable
   precision. The full ranked list is returned too, so the result page can
   show how every other archetype scored, not just the top one.
------------------------------------------------------------------------- */

function matchArchetype(normDims){
  const scored = ARCHETYPES.map(a => {
    const score = a.signature.reduce((sum, s) => sum + (normDims[s.dim] || 0) * s.w, 0);
    return { archetype: a, score };
  }).sort((x, y) => y.score - x.score);
  return { primary: scored[0].archetype, runnerUp: scored[1].archetype, ranked: scored };
}

/* -------------------------------------------------------------------------
   ALGORITHM: Sub-profile (why two people with the same archetype differ)
   An archetype is decided by only 3 signature dimensions, so two people
   can land on the same one while still being genuinely different once you
   look at the other 17. This finds the two dimensions the person scores
   highest on outside the archetype's own signature, and turns that into a
   short, specific sentence, so results within the same archetype aren't
   interchangeable.
------------------------------------------------------------------------- */

function computeSubProfile(normDims, archetype){
  const sigDims = new Set(archetype.signature.map(s => s.dim));
  const rest = DIMENSIONS.filter(d => !sigDims.has(d))
    .map(d => ({ d, v: normDims[d] || 0 }))
    .sort((a, b) => b.v - a.v);
  const top = rest.slice(0, 2).filter(x => x.v > 0);
  if (top.length === 0){
    return `Within ${archetype.name}, your other traits are fairly balanced, no single one pulling much harder than the rest.`;
  }
  const labels = top.map(x => DIM_LABELS[x.d]);
  return `Within ${archetype.name}, you lean especially into ${labels.join(" and ")}, which shapes your version of this type a little differently from someone else who tested the same result.`;
}

/* -------------------------------------------------------------------------
   ALGORITHM: Measured traits
   Each trait is a plain, deterministic formula over normalized dimensions
   (0-100 scale). No randomness anywhere in this file, so the same answers
   always produce the same reading, the way an actual assessment should.
------------------------------------------------------------------------- */

function pct(v){ return Math.round(((v + 10) / 20) * 100); }

function computeMeasuredTraits(normDims){
  const clamp = v => Math.max(1, Math.min(100, Math.round(v)));
  const g = k => pct(normDims[k] || 0);
  return {
    "Emotional Steadiness": clamp((g("resilience") + g("patience") + g("selfAwareness")) / 3),
    "Decision Confidence": clamp((g("confidence") + g("logic") + g("drive")) / 3),
    "Social Stamina": clamp((g("socialEnergy") + g("adaptability")) / 2),
    "Creative Output": clamp((g("creativity") + g("curiosity") + g("independence")) / 3),
    "Focus Capacity": clamp((g("discipline") + g("patience") + g("planning")) / 3),
    "Risk Tolerance": clamp(g("risk")),
    "Empathy Index": clamp((g("empathy") + g("kindness")) / 2),
    "Leadership Presence": clamp((g("leadership") + g("confidence") + g("drive")) / 3),
    "Adaptability Score": clamp(g("adaptability")),
    "Resilience Rating": clamp((g("resilience") + g("discipline")) / 2),
    "Trust Radius": clamp(g("trust")),
    "Independence Level": clamp(g("independence")),
    "Friendship Reliability": clamp((g("trust") + g("kindness") + g("patience") + g("empathy")) / 4),
    "Growth Mindset": clamp((g("selfAwareness") + g("curiosity") + g("optimism")) / 3),
    "Communication Clarity": clamp((g("logic") + g("confidence") + g("empathy")) / 3),
    "Stress Recovery": clamp((g("resilience") + g("optimism") + g("patience")) / 3),
  };
}

/* -------------------------------------------------------------------------
   ALGORITHM: Career matching
   For each career, fit = average normalized score across its 3 signature
   dimensions. Tiers: >=65 Excellent, >=45 Good, else Avoid (shown as a
   growth note rather than a value judgement). A one-line "why" is
   generated from whichever of the 3 dimensions scored highest for the
   person, referencing that trait by name.
------------------------------------------------------------------------- */

const DIM_LABELS = {
  confidence:"confidence", logic:"logical thinking", creativity:"creativity",
  humor:"humor", adaptability:"adaptability", curiosity:"curiosity",
  empathy:"empathy", leadership:"leadership", patience:"patience",
  drive:"drive", risk:"risk tolerance", trust:"trust", kindness:"kindness",
  discipline:"discipline", socialEnergy:"social energy",
  selfAwareness:"self-awareness", planning:"planning", resilience:"resilience",
  optimism:"optimism", independence:"independence"
};

function computeCareers(normDims){
  return CAREERS.map(c => {
    const scores = c.dims.map(d => pct(normDims[d] || 0));
    const fit = Math.round(scores.reduce((a,b)=>a+b,0) / scores.length);
    const topDimIdx = scores.indexOf(Math.max(...scores));
    const topDim = c.dims[topDimIdx];
    const tier = fit >= 65 ? "Excellent Match" : fit >= 45 ? "Good Match" : "Avoid";
    const why = tier === "Avoid"
      ? `Your natural ${DIM_LABELS[c.dims[scores.indexOf(Math.min(...scores))]]} leans elsewhere, so this isn't a strength fit today.`
      : `Your ${DIM_LABELS[topDim]} lines up well with what this path demands.`;
    return { name:c.name, fit, tier, why };
  }).sort((a,b) => b.fit - a.fit);
}

/* -------------------------------------------------------------------------
   ALGORITHM: Relationship matches
   Each relationship type weights a different subset of dimensions, using
   the person's own scores to describe how they show up in that dynamic
   (not a two-person comparison, that's the Compare page, below).
------------------------------------------------------------------------- */

const RELATIONSHIP_WEIGHTS = {
  friendship: ["trust","kindness","socialEnergy"],
  dating: ["empathy","trust","confidence"],
  marriage: ["patience","trust","discipline"],
  business: ["drive","logic","discipline"],
  creative: ["creativity","adaptability","curiosity"],
  travel: ["adaptability","risk","curiosity"],
  gaming: ["patience","logic","humor"],
  study: ["discipline","patience","logic"],
  roommate: ["patience","trust","discipline"],
};

function computeRelationshipStyles(normDims){
  return RELATIONSHIP_TYPES.map(r => {
    const dims = RELATIONSHIP_WEIGHTS[r.key];
    const score = Math.round(dims.reduce((s,d)=>s+pct(normDims[d]||0),0) / dims.length);
    return { key:r.key, label:r.label, score };
  });
}

/* -------------------------------------------------------------------------
   ALGORITHM: Personality code encode/decode
   Format:  [Name-]PF1-<archetypeIndex base36>-<20 dims packed as base36>-<checksum>
   Every dimension is clamped to -10..10, shifted to 0..20 so it always
   encodes as a single base36 digit (0-9,A-J covers 0-19, K covers 20).
   The checksum is a simple mod-36 sum of all digit values, guarding
   against typos when a code is shared or copy-pasted.
   The optional name is sanitized to letters, numbers and underscores only
   (so it can't contain the "-" delimiter) and placed at the front, e.g.
   Yota-PF1-8-FJHCFHKGFDJGIGDEGCCC-R. Fully local, no server round trip
   needed to decode either the name or the traits.
------------------------------------------------------------------------- */

const B36 = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";

function sanitizeName(name){
  return (name || "").trim().replace(/[^a-zA-Z0-9_]/g, "").slice(0, 20);
}

function encodeCode(archetypeId, normDims, name){
  const archIdx = ARCHETYPES.findIndex(a => a.id === archetypeId);
  const archDigit = B36[archIdx] || "0";
  let digits = "";
  let checksum = archIdx;
  DIMENSIONS.forEach(dim => {
    const shifted = Math.max(0, Math.min(20, (normDims[dim] || 0) + 10));
    digits += B36[shifted];
    checksum += shifted;
  });
  const checkDigit = B36[checksum % 36];
  const base = `PF1-${archDigit}-${digits}-${checkDigit}`;
  const cleanName = sanitizeName(name);
  return cleanName ? `${cleanName}-${base}` : base;
}

function decodeCode(code){
  try {
    const raw = code.trim();
    let name = "";
    let body = raw;
    const upperParts = raw.split("-");
    if (upperParts[0] && upperParts[0].toUpperCase() !== "PF1"){
      name = sanitizeName(upperParts[0]);
      body = upperParts.slice(1).join("-");
    }
    const parts = body.trim().toUpperCase().split("-");
    if (parts.length !== 4 || parts[0] !== "PF1") return null;
    const [, archDigit, digits, checkDigit] = parts;
    const archIdx = B36.indexOf(archDigit);
    if (archIdx < 0 || !ARCHETYPES[archIdx]) return null;
    if (digits.length !== DIMENSIONS.length) return null;
    let checksum = archIdx;
    const normDims = {};
    for (let i = 0; i < DIMENSIONS.length; i++){
      const val = B36.indexOf(digits[i]);
      if (val < 0 || val > 20) return null;
      checksum += val;
      normDims[DIMENSIONS[i]] = val - 10;
    }
    if (B36[checksum % 36] !== checkDigit) return null;
    return { archetype: ARCHETYPES[archIdx], normDims, name };
  } catch (e){
    return null;
  }
}

/* -------------------------------------------------------------------------
   ALGORITHM: Compatibility (Compare page)
   For two decoded profiles, compute:
   - relationshipScore: overall closeness, weighted toward complementary
     (not just identical) traits: leadership plus patience, drive plus
     planning, social energy plus empathy, and risk plus discipline are
     all treated as good complements, not just close matches.
   - communicationScore, adventureScore, creativeScore, trustScore: simple
     paired averages and similarity on relevant dimension clusters.
   - sharedStrengths / conflictAreas: dimensions where both score high
     (shared) versus dimensions with the largest gap (friction risk).
------------------------------------------------------------------------- */

function similarity(a, b){
  // 0..100, 100 = identical
  const diff = Math.abs(a - b);
  return Math.max(0, 100 - diff * 5);
}

function computeCompatibility(profileA, profileB){
  const a = profileA.normDims, b = profileB.normDims;
  const communicationScore = Math.round((similarity(a.socialEnergy,b.socialEnergy) + similarity(a.trust,b.trust) + similarity(a.empathy,b.empathy)) / 3);
  const adventureScore = Math.round((similarity(a.risk,b.risk) + similarity(a.adaptability,b.adaptability) + similarity(a.curiosity,b.curiosity)) / 3);
  const creativeScore = Math.round((similarity(a.creativity,b.creativity) + similarity(a.curiosity,b.curiosity)) / 2);
  const trustScore = Math.round((similarity(a.trust,b.trust) + similarity(a.kindness,b.kindness)) / 2);

  const complementBonus = [
    ["leadership","patience"], ["drive","planning"], ["socialEnergy","empathy"], ["risk","discipline"]
  ].reduce((sum, [x,y]) => sum + (100 - Math.abs(pct(a[x]) - pct(b[y]))) * 0.05, 0);

  const overallSimilarity = DIMENSIONS.reduce((s,d) => s + similarity(a[d], b[d]), 0) / DIMENSIONS.length;
  const relationshipScore = Math.round(Math.min(100, overallSimilarity * 0.75 + complementBonus));

  const shared = DIMENSIONS.filter(d => a[d] >= 3 && b[d] >= 3).sort((x,y)=>(b[y]+a[y])-(b[x]+a[x])).slice(0,4);
  const conflicts = DIMENSIONS.map(d => ({ d, gap: Math.abs(a[d]-b[d]) })).sort((x,y)=>y.gap-x.gap).slice(0,3).map(x=>x.d);

  return { relationshipScore, communicationScore, adventureScore, creativeScore, trustScore,
    sharedStrengths: shared.map(d => DIM_LABELS[d]), conflictAreas: conflicts.map(d => DIM_LABELS[d]) };
}

<script>
/* =========================================================================
   PERSONAFORGE, APP MODULE
   Renders every screen into #app. No framework, no build step.
   ========================================================================= */

const root = document.getElementById("app");
let session = null;
let lastResult = null;
let pendingName = "";
let soundOn = localStorage.getItem("pf_sound") !== "off";
let careersExpanded = false;

/* ---------------- tiny sound (optional, WebAudio, no assets) ---------- */
let audioCtx = null;
function click(freq = 440, dur = 0.045){
  if (!soundOn) return;
  try{
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
    o.frequency.value = freq; o.type = "sine";
    g.gain.setValueAtTime(0.05, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch(e){ /* audio unsupported, fail silently */ }
}

/* ---------------- decorative venetian blind bars ----------------------*/
function spawnAmbience(){
  const layer = document.getElementById("embers");
  if (!layer || layer.dataset.done) return;
  layer.dataset.done = "1";
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduce) return;
  for (let i = 0; i < 7; i++){
    const bar = document.createElement("div");
    bar.className = "blind-bar";
    bar.style.top = (10 + i * 13) + "vh";
    bar.style.animationDelay = (i * 1.4) + "s";
    layer.appendChild(bar);
  }
}

function pickLines(n){
  const pool = [...CALC_LINES];
  const out = [];
  for (let i = 0; i < n && pool.length; i++){
    const idx = Math.floor(Math.random() * pool.length);
    out.push(pool.splice(idx, 1)[0]);
  }
  return out;
}

/* ---------------- routing ---------------------------------------------*/
function navigate(view){
  window.scrollTo(0, 0);
  if (view === "landing") renderLanding();
  else if (view === "compare") renderCompare();
}

/* ---------------- shared chrome ---------------------------------------*/
function topBar(showBack){
  return `
  <div class="top-bar">
    <div class="brand-mini">${showBack ? `<button class="icon-btn" onclick="navigate('landing')" aria-label="Home">&larr;</button>` : ""}<span class="dot"></span><span>PersonaForge</span></div>
    <button class="icon-btn" onclick="toggleSound()" aria-label="Toggle sound">${soundOn ? "\u266B" : "\u2715"}</button>
  </div>`;
}
function toggleSound(){
  soundOn = !soundOn;
  localStorage.setItem("pf_sound", soundOn ? "on" : "off");
  click(soundOn ? 660 : 220);
  const btn = document.querySelector('.icon-btn[aria-label="Toggle sound"]');
  if (btn) btn.textContent = soundOn ? "\u266B" : "\u2715";
}

/* ---------------- LANDING ---------------------------------------------*/
function renderLanding(){
  const saved = localStorage.getItem("pf_last_code");
  root.innerHTML = `
    ${topBar(false)}
    <div class="landing">
      <div class="logo-mark">Case File 01</div>
      <h1>Persona<span>Forge</span></h1>
      <p class="tagline">Decode yourself. This is an adaptive read built from scenarios, not a survey. It takes about seven minutes, and it changes direction as you answer.</p>
      <div class="cta-row">
        <button class="btn btn-primary" onclick="click(520);goToNameScreen()">Begin &rarr;</button>
        <button class="btn btn-ghost" onclick="click(380);navigate('compare')">Compare Two Results</button>
      </div>
      ${saved ? `<button class="btn btn-ghost" style="margin-top:4px" onclick="click(380);loadSaved()">Reopen my last result</button>` : ""}
      <div class="meta-row">
        <span>Runs entirely on your device</span><span>&middot;</span><span>No account</span><span>&middot;</span><span>Works offline after first load</span>
      </div>

      <div class="quick-compare glass">
        <label>Already have someone's code? Paste it here to see how you match.</label>
        <div class="row">
          <input type="text" id="quickCode" placeholder="Name-PF1-...">
          <button class="btn btn-ghost" onclick="quickCompareGo()">Compare</button>
        </div>
      </div>
    </div>
    <div class="footer-nav">
      <button onclick="navigate('compare')">Compare page</button>
      <button onclick="alert('PersonaForge runs entirely in your browser. Nothing you answer is sent anywhere, and nothing is stored except a code on your own device if you choose to save it.')">Privacy</button>
    </div>
  `;
  spawnAmbience();
}

function quickCompareGo(){
  const val = document.getElementById("quickCode").value.trim();
  if (!val) return;
  sessionStorage.setItem("pf_prefill_b", val);
  click(420);
  navigate("compare");
}

function loadSaved(){
  const code = localStorage.getItem("pf_last_code");
  const decoded = code && decodeCode(code);
  if (!decoded){ alert("No valid saved result found on this device."); return; }
  lastResult = buildResultFromDecoded(decoded, code);
  renderResult();
}

/* ---------------- NAME CAPTURE -----------------------------------------*/
function goToNameScreen(){
  root.innerHTML = `
    ${topBar(true)}
    <div class="name-screen">
      <div class="eyebrow accent">BEFORE WE START</div>
      <h2>Who am I reading?</h2>
      <p>Your name goes at the front of your result and your personality code, so it's clearly yours if you ever share it.</p>
      <input type="text" id="nameField" class="name-input" placeholder="Your name" maxlength="20" autocomplete="off" />
      <button class="btn btn-primary" onclick="confirmName()">Continue &rarr;</button>
      <p style="font-size:12.5px;color:var(--text-dim)">You can also skip this and stay anonymous.</p>
      <button class="btn btn-ghost" onclick="click(360);startQuiz('')" style="margin-top:-6px">Skip for now</button>
    </div>
  `;
  spawnAmbience();
  setTimeout(() => {
    const f = document.getElementById("nameField");
    if (f){ f.focus(); f.onkeydown = (e) => { if (e.key === "Enter") confirmName(); }; }
  }, 50);
}
function confirmName(){
  const val = document.getElementById("nameField").value.trim();
  click(500);
  startQuiz(val);
}

/* ---------------- QUIZ --------------------------------------------------*/
function startQuiz(name){
  pendingName = name || "";
  session = new QuizSession(Date.now() % 100000, pendingName);
  renderQuiz();
}

function renderQuiz(){
  if (!session){ session = new QuizSession(Date.now() % 100000, pendingName); }
  const q = session.current();
  if (!q){ renderForging(); return; }
  const { current, total } = session.progress();
  const pctDone = Math.round((current / total) * 100);
  const existing = session.currentAnswer();
  root.innerHTML = `
    <div class="container">
      <div class="quiz-top">
        ${topBar(true)}
        <div class="progress-track"><div class="progress-fill" style="width:${pctDone}%"></div></div>
        <div class="progress-meta">
          <span>Question ${current + 1} of ${total}</span>
          <span class="encourage">${session.encouragement()}</span>
        </div>
      </div>
      <div class="question-card glass" id="qcard">
        <div class="quiz-nav-row">
          <button class="nav-btn" onclick="goBackQuestion()" ${session.canGoBack() ? "" : "disabled"}>&larr; Back</button>
          <div class="q-num">SCENARIO ${String(current + 1).padStart(2,"0")}</div>
          <span></span>
        </div>
        <div class="q-text">${q.text}</div>
        <div class="options" role="listbox" aria-label="Answer options">
          ${q.options.map((opt, i) => `
            <button class="option ${existing && existing.optionIndex === i ? "selected" : ""}" role="option" onclick="selectOption(${i})">
              <span class="opt-key">${String.fromCharCode(65+i)}</span>
              <span>${opt.text}</span>
            </button>`).join("")}
        </div>
        ${existing ? `<div class="continue-row"><button class="btn btn-ghost" onclick="continueForward()">Keep this answer, continue &rarr;</button></div>` : ""}
      </div>
    </div>
  `;
  spawnAmbience();
  attachKeyHandler();
}

function attachKeyHandler(){
  document.onkeydown = (e) => {
    if (["1","2","3"].includes(e.key)){
      const idx = parseInt(e.key, 10) - 1;
      const opts = document.querySelectorAll(".option");
      if (opts[idx]) selectOption(idx);
    } else if (e.key === "ArrowLeft" && session.canGoBack()){
      goBackQuestion();
    } else if (e.key === "ArrowRight" && session.canSkipForward()){
      continueForward();
    }
  };
}

function goBackQuestion(){
  click(300);
  session.goBack();
  renderQuiz();
}
function continueForward(){
  click(460);
  session.goForward();
  if (session.isComplete()) renderForging();
  else renderQuiz();
}

function selectOption(idx){
  const opts = document.querySelectorAll(".option");
  opts.forEach(o => o.classList.remove("selected"));
  if (opts[idx]) opts[idx].classList.add("selected");
  click(420 + idx * 60);
  session.answer(idx);
  const card = document.getElementById("qcard");
  if (card) card.classList.add("leaving");
  showCalcOverlay(1, () => {
    if (session.isComplete()) renderForging();
    else renderQuiz();
  });
}

function showCalcOverlay(count, done){
  document.onkeydown = null;
  const overlay = document.createElement("div");
  overlay.className = "calc-overlay";
  const line = pickLines(1)[0] || "Processing";
  overlay.innerHTML = `<div class="calc-bars"><span></span><span></span><span></span><span></span></div><div class="calc-line">${line}...</div>`;
  document.body.appendChild(overlay);
  setTimeout(() => {
    overlay.remove();
    done();
  }, 480);
}

/* ---------------- FORGING (brief transition + compute) -----------------*/
function renderForging(){
  document.onkeydown = null;
  const lines = pickLines(4);
  root.innerHTML = `
    <div class="forging">
      <div class="calc-bars"><span></span><span></span><span></span><span></span></div>
      <h2>Putting it together</h2>
      <p id="forge-line">${lines[0]}...</p>
    </div>`;
  let i = 0;
  const int = setInterval(() => {
    i++;
    const el = document.getElementById("forge-line");
    if (el && lines[i]) el.textContent = lines[i] + "...";
  }, 420);
  setTimeout(() => {
    clearInterval(int);
    computeResult();
    renderResult();
  }, 1900);
}

function computeResult(){
  const normDims = session.normalizedDims();
  const match = matchArchetype(normDims);
  const code = encodeCode(match.primary.id, normDims, session.name);
  lastResult = {
    name: session.name || "",
    normDims,
    archetype: match.primary,
    runnerUp: match.runnerUp,
    ranked: match.ranked,
    subProfile: computeSubProfile(normDims, match.primary),
    code,
    careers: computeCareers(normDims),
    relationships: computeRelationshipStyles(normDims),
    traits: computeMeasuredTraits(normDims),
  };
  localStorage.setItem("pf_last_code", code);
  careersExpanded = false;
}

function buildResultFromDecoded(decoded, code){
  const normDims = decoded.normDims;
  const match = matchArchetype(normDims);
  return {
    name: decoded.name || "",
    normDims,
    archetype: decoded.archetype,
    runnerUp: match.runnerUp,
    ranked: match.ranked,
    subProfile: computeSubProfile(normDims, decoded.archetype),
    code,
    careers: computeCareers(normDims),
    relationships: computeRelationshipStyles(normDims),
    traits: computeMeasuredTraits(normDims),
  };
}

/* ---------------- RESULT -------------------------------------------------*/
function renderResult(){
  const r = lastResult;
  const a = r.archetype;
  const topCareers = careersExpanded ? r.careers : r.careers.slice(0, 8);
  root.innerHTML = `
    <div class="container result-hero">
      ${topBar(true)}
      ${r.name ? `<div class="name-tag">${r.name}'s Result</div>` : `<div class="name-tag">Your Result</div>`}
      <div class="ingot glass">
        <div class="ingot-icon">${a.icon}</div>
        <div class="archetype-eyebrow">Primary Archetype</div>
        <h2 class="ingot-name">${a.name}</h2>
        <div class="ingot-title">${a.title}</div>
        <p class="ingot-desc">${a.description}</p>
        <p class="ingot-sub">${r.subProfile}</p>
        <div class="ingot-code">${r.code}</div>
      </div>
      <div class="export-row">
        <button class="btn btn-ghost" onclick="exportPNG('story')">Export Story</button>
        <button class="btn btn-ghost" onclick="exportPNG('post')">Export Post</button>
        <button class="btn btn-ghost" onclick="window.print()">Save as PDF</button>
        <button class="btn btn-ghost" onclick="copyCode()">Copy Code</button>
      </div>

      <div class="compare-widget glass">
        <h4>Compare with someone else</h4>
        <p class="hint">Paste a friend's PersonaForge code to see how well you'd actually get along.</p>
        <div class="row">
          <input type="text" id="inlineCompareCode" placeholder="Name-PF1-...">
          <button class="btn btn-accent" onclick="runInlineCompare()">Compare</button>
        </div>
        <div id="inlineCompareOut"></div>
      </div>

      <div class="section">
        <div class="section-title"><span class="eyebrow">Hidden Trait Radar</span></div>
        <canvas id="radar" width="520" height="520" role="img" aria-label="Radar chart of 20 hidden personality dimensions"></canvas>
        <div class="radar-legend">20 dimensions, measured from your answers, never shown to you during the test</div>
      </div>

      <div class="section">
        <div class="section-title"><span class="eyebrow">Strengths and Growth Edges</span></div>
        <div class="grid-2">
          <div class="card glass"><h4>Strengths</h4><div class="tag-list">${a.strengths.map(s=>`<span class="tag">${s}</span>`).join("")}</div></div>
          <div class="card glass"><h4>Watch-outs</h4><div class="tag-list">${a.weaknesses.map(s=>`<span class="tag">${s}</span>`).join("")}</div></div>
        </div>
      </div>

      <div class="section">
        <div class="section-title"><span class="eyebrow">How You Operate</span></div>
        <div class="grid-2">
          <div class="card glass"><h4>Work Style</h4><p>${a.workStyle}</p></div>
          <div class="card glass"><h4>Under Stress</h4><p>${a.stressResponse}</p></div>
          <div class="card glass"><h4>Friendship</h4><p>${a.friendshipStyle}</p></div>
          <div class="card glass"><h4>Dating</h4><p>${a.datingStyle}</p></div>
          <div class="card glass"><h4>Leadership</h4><p>${a.leadershipStyle}</p></div>

/* ---------------- Radar chart (canvas, no library) ---------------------*/
function drawRadar(canvas, normDims){
  if (!canvas) return;
  const ctx = canvas.getContext("2d");
  const dpr = window.devicePixelRatio || 1;
  const size = Math.min(500, root.clientWidth - 20);
  canvas.width = size * dpr; canvas.height = size * dpr;
  canvas.style.width = size + "px"; canvas.style.height = size + "px";
  ctx.scale(dpr, dpr);
  const cx = size/2, cy = size/2, R = size/2 - 52;
  const dims = DIMENSIONS;
  const n = dims.length;
  ctx.clearRect(0,0,size,size);

  ctx.strokeStyle = "rgba(255,255,255,0.07)";
  ctx.lineWidth = 1;
  for (let ring = 1; ring <= 4; ring++){
    ctx.beginPath();
    for (let i = 0; i <= n; i++){
      const angle = (i / n) * Math.PI * 2 - Math.PI/2;
      const r = (R * ring)/4;
      const x = cx + Math.cos(angle) * r, y = cy + Math.sin(angle) * r;
      i === 0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
    }
    ctx.stroke();
  }
  ctx.fillStyle = "rgba(237,234,227,0.5)";
  ctx.font = "9.5px Manrope, sans-serif";
  dims.forEach((d, i) => {
    const angle = (i / n) * Math.PI * 2 - Math.PI/2;
    const x = cx + Math.cos(angle) * R, y = cy + Math.sin(angle) * R;
    ctx.strokeStyle = "rgba(255,255,255,0.05)";
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(x,y); ctx.stroke();
    const lx = cx + Math.cos(angle) * (R + 18), ly = cy + Math.sin(angle) * (R + 18);
    ctx.textAlign = Math.cos(angle) > 0.2 ? "left" : Math.cos(angle) < -0.2 ? "right" : "center";
    ctx.fillText(d, lx, ly);
  });

  ctx.beginPath();
  dims.forEach((d, i) => {
    const angle = (i / n) * Math.PI * 2 - Math.PI/2;
    const val = Math.max(0, Math.min(1, (normDims[d] + 10) / 20));
    const r = R * val;
    const x = cx + Math.cos(angle) * r, y = cy + Math.sin(angle) * r;
    i === 0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
  });
  ctx.closePath();
  ctx.fillStyle = "rgba(179,36,43,0.16)";
  ctx.strokeStyle = "#B3242B";
  ctx.lineWidth = 1.6;
  ctx.fill(); ctx.stroke();

  // vertex dots
  ctx.fillStyle = "#EDEAE3";
  dims.forEach((d, i) => {
    const angle = (i / n) * Math.PI * 2 - Math.PI/2;
    const val = Math.max(0, Math.min(1, (normDims[d] + 10) / 20));
    const r = R * val;
    const x = cx + Math.cos(angle) * r, y = cy + Math.sin(angle) * r;
    ctx.beginPath(); ctx.arc(x, y, 2, 0, Math.PI*2); ctx.fill();
  });
}

/* ---------------- PNG export (canvas render of a share card) -----------*/
function exportPNG(kind){
  const r = lastResult; const a = r.archetype;
  const dims = kind === "story" ? { w: 1080, h: 1920 } : { w: 1080, h: 1350 };
  const canvas = document.createElement("canvas");
  canvas.width = dims.w; canvas.height = dims.h;
  const ctx = canvas.getContext("2d");

  ctx.fillStyle = "#050505";
  ctx.fillRect(0,0,dims.w,dims.h);
  const glow = ctx.createRadialGradient(dims.w/2, dims.h*0.22, 40, dims.w/2, dims.h*0.22, dims.w*0.7);
  glow.addColorStop(0, "rgba(179,36,43,0.18)"); glow.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = glow; ctx.fillRect(0,0,dims.w,dims.h);

  ctx.textAlign = "center";
  ctx.fillStyle = "#9A968D";
  ctx.font = "600 26px 'Space Grotesk', sans-serif";
  ctx.fillText("PERSONAFORGE", dims.w/2, dims.h*0.12);

  if (r.name){
    ctx.font = "500 30px 'JetBrains Mono', monospace";
    ctx.fillStyle = "#EDEAE3";
    ctx.fillText(r.name.toUpperCase(), dims.w/2, dims.h*0.18);
  }

  ctx.font = "700 90px 'Space Grotesk', sans-serif";
  ctx.fillStyle = "#F5F1EA";
  ctx.fillText(a.icon, dims.w/2, dims.h*0.30);

  ctx.font = "700 60px 'Space Grotesk', sans-serif";
  wrapText(ctx, a.name, dims.w/2, dims.h*0.38, dims.w*0.85, 66);

  ctx.font = "italic 400 28px 'Manrope', sans-serif";
  ctx.fillStyle = "#9A968D";
  ctx.fillText(a.title, dims.w/2, dims.h*0.44);

  ctx.font = "400 26px 'Manrope', sans-serif";
  ctx.fillStyle = "#D8D2C8";
  wrapText(ctx, a.description, dims.w/2, dims.h*0.52, dims.w*0.78, 38);

  const topTraits = Object.entries(r.traits).sort((x,y)=>y[1]-x[1]).slice(0,3);
  const statY = dims.h*0.7;
  const spacing = dims.w/4;
  topTraits.forEach(([k,v], i) => {
    const x = dims.w/2 + (i-1)*spacing;
    ctx.font = "700 50px 'Space Grotesk', sans-serif"; ctx.fillStyle = "#EDEAE3";
    ctx.fillText(v, x, statY);
    ctx.font = "400 18px 'Manrope', sans-serif"; ctx.fillStyle = "#9A968D";
    wrapText(ctx, k, x, statY + 30, spacing - 10, 20);
  });

  ctx.font = "400 22px 'JetBrains Mono', monospace";
  ctx.fillStyle = "#5C584F";
  ctx.fillText(r.code, dims.w/2, dims.h*0.95);

  const link = document.createElement("a");
  link.download = `personaforge-${kind}.png`;
  link.href = canvas.toDataURL("image/png");
  link.click();
  click(760);
}
function wrapText(ctx, text, x, y, maxWidth, lineHeight){
  const words = String(text).split(" ");
  let line = "", lines = [];
  words.forEach(w => {
    const test = line + w + " ";
    if (ctx.measureText(test).width > maxWidth && line){ lines.push(line); line = w + " "; }
    else line = test;
  });
  lines.push(line);
  const startY = y - ((lines.length-1)*lineHeight)/2;
  lines.forEach((l,i) => ctx.fillText(l.trim(), x, startY + i*lineHeight));
}

function renderCompare(){
  const prefillB = sessionStorage.getItem("pf_prefill_b") || "";
  sessionStorage.removeItem("pf_prefill_b");

    <div class="container">

        <div><label>Person A code</label><textarea id="codeA" placeholder="Name-PF1-...">${lastResult ? lastResult.code : ""}</textarea></div>
        <div><label>Person B code</label><textarea id="codeB" placeholder="Name-PF1-...">${prefillB}</textarea></div>
      </div>

        <button class="btn btn-primary" onclick="runCompare()">Compare</button>
      </div>
      <div id="compareOut"></div>

  `;
}

function runCompare(){
  const a = decodeCode(document.getElementById("codeA").value);
  const b = decodeCode(document.getElementById("codeB").value);
  const out = document.getElementById("compareOut");
  if (!a || !b){
    out.innerHTML = `<p class="center-note" style="text-align:left">One or both codes look off. Double check for typos and try again.</p>`;
    return;
  }
  const c = computeCompatibility(a, b);
  out.innerHTML = renderCompareResult(a.archetype, a.name, b.archetype, b.name, c);
}

function renderCompareResult(archA, nameA, archB, nameB, c){
  return `
    <div class="section">
      <div class="card glass" style="text-align:center">
        <h4>${nameA || "Person A"} and ${nameB || "Person B"}</h4>
        <p style="color:var(--text-muted);margin-top:4px">${archA.icon} ${archA.name} &nbsp;meets&nbsp; ${archB.icon} ${archB.name}</p>
        <div class="ingot-name" style="font-size:44px;margin-top:14px">${c.relationshipScore}%</div>
        <p style="color:var(--text-muted)">Overall Compatibility</p>
      </div>
      <div class="grid-2" style="margin-top:12px">
        <div class="card glass"><h4>Communication</h4><div class="stat-bar-track"><div class="stat-bar-fill" style="width:${c.communicationScore}%"></div></div></div>
        <div class="card glass"><h4>Adventure</h4><div class="stat-bar-track"><div class="stat-bar-fill" style="width:${c.adventureScore}%"></div></div></div>
        <div class="card glass"><h4>Creative</h4><div class="stat-bar-track"><div class="stat-bar-fill" style="width:${c.creativeScore}%"></div></div></div>
        <div class="card glass"><h4>Trust</h4><div class="stat-bar-track"><div class="stat-bar-fill" style="width:${c.trustScore}%"></div></div></div>
      </div>
      <div class="grid-2" style="margin-top:12px">
        <div class="card glass"><h4>Shared Strengths</h4><div class="tag-list">${c.sharedStrengths.map(s=>`<span class="tag">${s}</span>`).join("") || "<span class='tag'>Still emerging</span>"}</div></div>
        <div class="card glass"><h4>Possible Friction</h4><div class="tag-list">${c.conflictAreas.map(s=>`<span class="tag">${s}</span>`).join("")}</div></div>
      </div>

    </div>
  `;
}
