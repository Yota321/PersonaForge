<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0F1117" />
<title>Forge &bull; Assessment</title>
<meta name="description" content="A personality read that actually adapts to you. Answer real scenarios, not a survey." />
<link rel="canonical" href="https://yota321.github.io/PersonaForge/quiz.html" />
<meta name="robots" content="noindex" />
<link rel="icon" type="image/svg+xml" href="assets/Icon_black.svg" media="(prefers-color-scheme: light)" />
<link rel="icon" type="image/svg+xml" href="assets/Icon_white.svg" media="(prefers-color-scheme: dark)" />
<link rel="icon" type="image/png" href="assets/Icon_black_192.png" />
<link rel="apple-touch-icon" href="assets/Icon_white_512.png" />
<link rel="manifest" href="manifest.json" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://api.fontshare.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@400,500,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/pages.css">
</head>
<body>
<div id="embers" aria-hidden="true"></div>
<!-- Structural rather than part of a render*() template: this page hosts
     both the name-capture screen and the quiz (re-rendered in place into
     #app), so a flatten div that only one of those templates included
     would vanish the moment the other one replaced #app's content.
     Living here instead keeps both screens flat, matching the landing
     page's own quiet background instead of the raw ambient glow. -->
<div class="lp-bg-flatten" aria-hidden="true"></div>
<div id="app"></div>
<audio id="bgMusic" src="assets/BG.mp3" loop preload="auto"></audio>
<div class="scrollbar-rail" id="sbRail" aria-hidden="true">
  <div class="scrollbar-track" id="sbTrack"></div>
  <div class="scrollbar-thumb" id="sbThumb"></div>
</div>

<script src="js/engine.js"></script>
<script src="js/global.js"></script>
<script src="js/pages.js"></script>
<script>
const PF_PAGE = "quiz";
applyTheme(currentTheme);
(function boot(){
  if (sessionStorage.getItem("pf_resume_quiz") === "1"){
    sessionStorage.removeItem("pf_resume_quiz");
    const saved = getSavedQuizProgress();
    if (saved){
      session = restoreQuizSession(saved);
      renderQuiz();
      return;
    }
  }
  renderNameScreen();
})();
</script>
</body>
</html>
