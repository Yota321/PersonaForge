<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#0F1117" />
<title>Forge · Recalibrating…</title>
<meta name="description" content="This route did not make it through the forge. Redirecting you back to PersonaForge." />
<style>
  /* =====================================================================
     Same design language as the main app: dark-first, soft purple accent,
     glassmorphism cards, Cabinet Grotesk / JetBrains Mono type. Kept as a
     single self-contained file since a 404 page can't depend on the app
     ever having loaded.
     ===================================================================== */
  :root{
    --bg: #0F1117;
    --bg-alt: #12141C;
    --card: rgba(30,34,48,0.55);
    --border: rgba(167,139,250,0.18);
    --text: #F8FAFC;
    --text-muted: #A7B0C2;
    --text-dim: #6B7385;
    --accent: #A78BFA;
    --accent-soft: #C4B5FD;
    --sky: #7DD3FC;
    --shadow: 0 24px 60px -20px rgba(8,9,14,0.6);
    --ease: cubic-bezier(.22,1,.36,1);
  }
  [data-theme="light"]{
    --bg: #FFFFFF;
    --bg-alt: #F8FAFC;
    --card: rgba(255,255,255,0.6);
    --border: rgba(100,116,139,0.22);
    --text: #0F172A;
    --text-muted: #475569;
    --text-dim: #64748B;
    --accent: #8B5CF6;
    --accent-soft: #A78BFA;
    --sky: #0EA5E9;
    --shadow: 0 24px 50px -22px rgba(100,116,139,0.35);
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg: #FFFFFF; --bg-alt: #F8FAFC; --card: rgba(255,255,255,0.6);
      --border: rgba(100,116,139,0.22); --text: #0F172A; --text-muted: #475569;
      --text-dim: #64748B; --accent: #8B5CF6; --accent-soft: #A78BFA; --sky: #0EA5E9;
      --shadow: 0 24px 50px -22px rgba(100,116,139,0.35);
    }
  }

  *{ box-sizing: border-box; margin:0; padding:0; }
  html, body{ height:100%; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Cabinet Grotesk', 'Manrope', system-ui, -apple-system, sans-serif;
    min-height: 100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 24px;
    position: relative;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  body::before{
    content:'';
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(55% 45% at 20% 0%, rgba(167,139,250,0.20), transparent 60%),
      radial-gradient(50% 40% at 100% 10%, rgba(125,211,252,0.14), transparent 60%),
      radial-gradient(45% 35% at 50% 100%, rgba(110,231,183,0.10), transparent 60%);
  }

  .card{
    position:relative; z-index:1;
    width:100%; max-width: 420px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 24px;
    backdrop-filter: blur(20px) saturate(140%);
    -webkit-backdrop-filter: blur(20px) saturate(140%);
    box-shadow: var(--shadow);
    padding: 44px 32px 36px;
    text-align:center;
    animation: rise .6s var(--ease) both;
  }

  .mark{
    width:56px; height:56px; margin: 0 auto 20px;
    display:flex; align-items:center; justify-content:center;
    border-radius: 16px;
    background: linear-gradient(145deg, rgba(167,139,250,0.18), rgba(125,211,252,0.10));
    border: 1px solid var(--border);
    animation: pulse 2.4s var(--ease) infinite;
  }
  .mark img{ width:30px; height:30px; display:block; }

  h1{
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin-bottom: 6px;
  }
  h1 .dot{ color: var(--accent); }

  .tagline{
    font-family: 'JetBrains Mono', 'Geist Mono', 'Courier New', monospace;
    font-size: 11.5px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent-soft);
    margin-bottom: 22px;
  }

  .message{
    color: var(--text-muted);
    font-size: 14.5px;
    line-height: 1.55;
    margin-bottom: 26px;
  }
  .message code{
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    color: var(--text-dim);
    word-break: break-all;
  }

  .spinner{
    width: 18px; height: 18px;
    margin: 0 auto 22px;
    border-radius: 50%;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    animation: spin 0.8s linear infinite;
  }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    width:100%;
    padding: 13px 20px;
    border-radius: 14px;
    border: none;
    background: var(--accent);
    color: #14101F;
    font-family: inherit;
    font-weight: 700;
    font-size: 14.5px;
    cursor: pointer;
    text-decoration:none;
    transition: background .2s var(--ease), transform .2s var(--ease), opacity .3s var(--ease);
    opacity: 0;
    pointer-events: none;
  }
  .btn:hover{ background: var(--accent-soft); transform: translateY(-2px); }
  .btn.visible{ opacity: 1; pointer-events: auto; }

  .footer-note{
    margin-top: 18px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.04em;
    color: var(--text-dim);
  }

  @keyframes rise{
    from{ opacity:0; transform: translateY(14px) scale(.985); }
    to{ opacity:1; transform: translateY(0) scale(1); }
  }
  @keyframes pulse{
    0%, 100%{ box-shadow: 0 0 0 0 rgba(167,139,250,0.28); }
    50%{ box-shadow: 0 0 0 10px rgba(167,139,250,0); }
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>

  <main class="card" role="status" aria-live="polite">
    <div class="mark">
      <!-- src is set by script below once the base path is known; the
           onerror swap between white/black icon variants stays in markup
           since it needs no path knowledge to work, only a bare filename. -->
      <img id="markIcon" alt="" width="30" height="30" />
    </div>
    <h1>Forge<span class="dot">.</span></h1>
    <p class="tagline">Discover. Compare. Evolve.</p>
    <div class="spinner" aria-hidden="true"></div>
    <p class="message">This URL did not score high enough to exist.<br>Reforging your path back to Forge…</p>
    <a class="btn" id="returnBtn" href=".">Back to Forge</a>
    <p class="footer-note">Nothing here was tracked. Your data never left this device.</p>
  </main>

  <noscript>
    <!--
      No-JS fallback. Without script we can't ask the service worker for
      its real scope or apply the GitHub Pages heuristic below, so this
      leans entirely on browser URL-resolution rules instead of a
      hardcoded path:

      "." is resolved by the browser relative to the *current* (broken)
      URL. GitHub Pages serves this file's content at the original
      requested address (e.g. ".../PersonaForge/Yota-PF2-abcd1234" or a
      custom domain's ".../Name-PF2-abcd1234"), and for a URL with one
      path segment past the app's base, "." resolves to exactly that
      base, no matter what it's called or how deep the domain root is.
      Query params and hash are lost in this no-JS path (there's no way
      around that without script), but the visitor always lands back on
      a working app rather than a dead end.
    -->
    <meta http-equiv="refresh" content="0; url=." />
    <p><a href=".">Back to Forge</a></p>
  </noscript>

  <script>
    (function () {
      "use strict";

      /* -----------------------------------------------------------------
         Match the app's own theme choice if it's already been set
         (localStorage is shared across every path on this origin), else
         fall back to the OS preference via the same rule the CSS above
         uses (light only if the OS asks for it and nothing overrides it;
         dark by default). `resolvedTheme` is reused below to pick the
         icon color that's actually readable on that background — a
         white glyph on a light card is invisible, and vice versa.
         ----------------------------------------------------------------- */
      var resolvedTheme = "dark";
      try {
        var savedTheme = window.localStorage.getItem("pf_theme");
        if (savedTheme === "light" || savedTheme === "dark") {
          resolvedTheme = savedTheme;
          document.documentElement.setAttribute("data-theme", savedTheme);
        } else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) {
          resolvedTheme = "light";
        }
      } catch (e) { /* localStorage unavailable (private mode, etc.), default to dark */ }

      /* -----------------------------------------------------------------
         ASSET CONFIG — the one place to edit if icon filenames ever
         change. Bare filenames only; the base path they hang off of is
         resolved dynamically below, never hardcoded.
         ----------------------------------------------------------------- */
      var ICONS = { white: "assets/Icon_white.svg", black: "assets/Icon_black.svg" };

      /* -----------------------------------------------------------------
         BASE PATH DETECTION — no hardcoded repo name, branch, or host.
         GitHub Pages serves this file's *content* at whatever URL the
         visitor actually requested (it does not redirect first), so
         location.pathname here is the broken URL, not this file's own
         location — we can't just resolve paths relative to the script.
         Two strategies, tried in order:

         1. Ask an already-installed service worker for its scope. If
            this visitor has ever loaded the real app before, the worker
            registered from index.html knows *exactly* where the app
            lives — this covers every case correctly, including a custom
            domain deployed into a subdirectory, which no heuristic can
            guess reliably on its own.

         2. Fall back to the standard GitHub Pages convention: a project
            page's first path segment is its repo name
            ("user.github.io/repo/..."), so on a "*.github.io" host we
            take that first segment as the base. A user/org page
            ("user.github.io/...") or a custom domain has no such
            segment, so it falls through to "/" (site root) — which is
            also correct for a root deployment.

         This means renaming the repo, forking it, or moving it to a
         custom domain never requires touching this file.
         ----------------------------------------------------------------- */
      function detectBasePathFromConvention() {
        var host = window.location.hostname || "";
        var segments = window.location.pathname.split("/").filter(Boolean);
        if (/\.github\.io$/i.test(host) && segments.length > 0) {
          return "/" + segments[0] + "/"; // project page: /<repo>/
        }
        return "/"; // user/org page root, or a custom domain
      }

      function detectBasePath() {
        if (!("serviceWorker" in navigator)) {
          return Promise.resolve(detectBasePathFromConvention());
        }
        return navigator.serviceWorker.getRegistrations()
          .then(function (registrations) {
            if (registrations && registrations.length > 0 && registrations[0].scope) {
              return new URL(registrations[0].scope).pathname;
            }
            return detectBasePathFromConvention();
          })
          .catch(function () {
            return detectBasePathFromConvention();
          });
      }

      function buildRedirectURL(basePath) {
        var loc = window.location;
        var origin = loc.origin || (loc.protocol + "//" + loc.host);

        // Whatever the server couldn't find — e.g. "<base>Yota-PF2-abcd1234"
        var pathname = loc.pathname || "/";
        var rest = pathname.indexOf(basePath) === 0
          ? pathname.slice(basePath.length)
          : pathname.replace(/^\//, "");
        var segments = rest.split("/").filter(Boolean);

        var params = new URLSearchParams(loc.search || "");

        // An explicit ?code=... on the broken URL always wins. Otherwise,
        // if the trailing path segment looks like a PF1/PF2 code, restore
        // it exactly the way a normal shared link would carry it — this
        // mirrors index.html's own getProfileCodeFromURL() fallback. Any
        // other, unrecognized segment is preserved too (as "path"), so
        // route formats added to the app later still survive a 404 —
        // this page doesn't need to know what they mean, only carry them.
        if (!params.get("code") && segments.length) {
          var last = segments[segments.length - 1];
          if (/-PF[12]-/.test(last)) {
            params.set("code", decodeURIComponent(last));
          } else {
            params.set("path", segments.join("/"));
          }
        }

        var target = origin + basePath;
        var query = params.toString();
        if (query) target += "?" + query;
        if (loc.hash) target += loc.hash; // hash fragments pass through untouched

        // Redirect-loop guard: if everything we'd redirect to is already
        // exactly where we are (which would only happen if a real page at
        // the base path itself somehow 404'd), stop folding the path into
        // a param and just go to the bare base path instead.
        if (target === loc.href) {
          target = origin + basePath;
        }

        return target;
      }

      var returnBtn = document.getElementById("returnBtn");
      var markIcon = document.getElementById("markIcon");

      detectBasePath().then(function (basePath) {
        if (!basePath) basePath = "/";

        if (markIcon) {
          // Dark background needs the white glyph; light background needs
          // the black glyph, or it just disappears into the card.
          var primaryIcon = resolvedTheme === "light" ? ICONS.black : ICONS.white;
          var fallbackIcon = resolvedTheme === "light" ? ICONS.white : ICONS.black;
          markIcon.src = basePath + primaryIcon;
          markIcon.onerror = function () {
            markIcon.onerror = null;
            markIcon.src = basePath + fallbackIcon;
          };
        }

        var redirectUrl = basePath;
        try {
          redirectUrl = buildRedirectURL(basePath);
        } catch (e) {
          redirectUrl = basePath; // safest possible fallback
        }

        if (returnBtn) returnBtn.setAttribute("href", redirectUrl);

        // Automatic redirect, ~1 second in — long enough to read the
        // message, short enough not to feel stuck.
        var redirected = false;
        window.setTimeout(function () {
          redirected = true;
          window.location.replace(redirectUrl);
        }, 1000);

        // Safety net: if for any reason the automatic redirect doesn't
        // happen (blocked navigation, slow/unusual browser, etc.), reveal
        // the manual button shortly after so the visitor is never stuck.
        window.setTimeout(function () {
          if (!redirected && returnBtn) returnBtn.classList.add("visible");
        }, 1800);
      });
    })();
  </script>
</body>
</html>
