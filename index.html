<script>


/* =========================================================================
   PERSONAFORGE, APP MODULE
   Renders every screen into #app. No framework, no build step.
   ========================================================================= */

const root = document.getElementById("app");
let session = null;
let lastResult = null;
let pendingName = "";
let soundOn = localStorage.getItem("pf_sound") !== "off";
let currentTheme = localStorage.getItem("pf_theme") === "light" ? "light" : "dark";

/* ---------------- theme (light / dark) ------------------------------------
   Dark is the default since that's the theme that's been built and
   refined so far, but light mode is fully implemented too. Switching is
   instant via a CSS attribute (everything else uses CSS custom
   properties so it repaints on its own), except canvas-drawn pixels
   (radar chart, QR code) which need an explicit redraw since their
   colors are baked in at draw time, not read live from CSS. */
function applyTheme(theme){
  currentTheme = theme;
  document.documentElement.dataset.theme = theme;
  localStorage.setItem("pf_theme", theme);
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", theme === "light" ? "#FFFFFF" : "#0F1117");
}
let themeScanTransition = null;
function toggleTheme(){
  // A click while the previous scan is still playing would call
  // startViewTransition() again before the first transition has settled.
  // Chromium responds by rejecting the in-flight transition's `ready`
  // promise with InvalidStateError ("Transition was aborted because of
  // invalid state") -- and since nothing held a reference to it, that
  // rejection went unhandled. Ignoring re-entrant clicks until the current
  // scan finishes avoids the overlap instead of just swallowing the error.
  if (themeScanTransition) return;
  const next = currentTheme === "light" ? "dark" : "light";
  const applyAndRefresh = () => {
    applyTheme(next);
    // Only the result page has canvas-drawn pixels (radar chart, QR code)
    // whose colors are baked in at draw time rather than read live from
    // CSS, so it's the one screen that needs a forced re-render. Every
    // other screen (quiz, landing, compare, party) uses CSS custom
    // properties directly and repaints on its own, so toggling theme
    // there never interrupts what the person is doing (e.g. mid-quiz).
    if (lastResult && document.getElementById("radar")){ renderResult(); }
    else { updateThemeIcon(); updateBrandLogo(); }
  };
  click(300);
  // The bottom-to-top scan is built on the View Transitions API: it
  // snapshots the page before/after the DOM change below and lets us
  // reveal the "after" snapshot with a custom clip-path animation (see
  // the ::view-transition-new(root) keyframes) instead of the browser's
  // default cross-fade. No polyfill or manual DOM cloning needed, but
  // it's Chromium-only today — Safari/Firefox and reduced-motion simply
  // keep the previous instant-ish CSS-transition swap, which is a fine
  // degradation since the scan is a delight-on-top, not a requirement.
  if (reducedMotion() || typeof document.startViewTransition !== "function"){
    document.body.classList.add("theme-transitions");
    applyAndRefresh();
    return;
  }
  themeScanTransition = document.startViewTransition(applyAndRefresh);
  // `ready` can still reject for reasons outside our control (e.g. the tab
  // being hidden mid-scan) even with the re-entrancy guard above, so it
  // needs its own handler rather than being left to reject unheard.
  themeScanTransition.ready.catch(() => {});
  themeScanTransition.finished.finally(() => { themeScanTransition = null; });
}
function updateThemeIcon(){
  const item = document.getElementById("navThemeItem");
  if (item) item.innerHTML = `${currentTheme === "light" ? ICONS.moon : ICONS.sun}<span>${currentTheme === "light" ? "Dark mode" : "Light mode"}</span>`;
}
function setPageTitle(suffix){
  document.title = suffix ? `Forge \u2022 ${suffix}` : "Forge";
}

function updateBrandLogo(){
  const path = currentTheme === "light" ? "assets/Logo_black.svg" : "assets/Logo_white.svg";
  const navLogo = document.getElementById("navLogo");
  if (navLogo) navLogo.src = path;
  const footerLogo = document.getElementById("lpFooterLogo");
  if (footerLogo) footerLogo.src = path;
}
let careersExpanded = false;
let funStatsOpen = false;

/* ---------------- tiny sound (optional, WebAudio, no assets) ---------- */
let audioCtx = null;
function click(freq = 440, dur = 0.045){
  if (!soundOn) return;
  try{
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
    o.frequency.value = freq; o.type = "sine";
    g.gain.setValueAtTime(0.05, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch(e){ /* audio unsupported, fail silently */ }
}

/* ---------------- background music -------------------------------------
   BG.mp3 lives in the assets folder, loaded via
   the <audio id="bgMusic"> element outside #app so it keeps playing
   across every screen re-render instead of restarting. The same speaker
   icon that mutes the tiny click sounds controls this too. Browsers
   block audio autoplay until a real user gesture, so playback is
   attempted on the first interaction anywhere on the page, once. */
const bgMusic = document.getElementById("bgMusic");
if (bgMusic){
  bgMusic.volume = 0.35;
  bgMusic.addEventListener("error", () => {
    // assets/BG.mp3 missing or failed to load: fail silently, never break the app
  });
  const startMusicOnce = () => {
    if (!soundOn){ document.removeEventListener("pointerdown", startMusicOnce); return; }
    bgMusic.play().then(() => {
      document.removeEventListener("pointerdown", startMusicOnce);
    }).catch(() => {
      // Autoplay genuinely blocked even after a real gesture (happens on
      // some mobile browsers with stricter policies). Show a visible,
      // dismissible prompt instead of failing silently with no way for
      // the person to know why there's no sound.
      showAudioPrompt();
    });
  };
  document.addEventListener("pointerdown", startMusicOnce);
}
function showAudioPrompt(){
  if (document.getElementById("audioPrompt")) return;
  const el = document.createElement("button");
  el.id = "audioPrompt";
  el.className = "audio-prompt";
  el.textContent = "Tap anywhere to enable audio";
  el.onclick = retryAudioPrompt;
  document.body.appendChild(el);
  document.addEventListener("pointerdown", retryAudioPrompt);
}
function retryAudioPrompt(){
  if (!bgMusic || !soundOn) return;
  bgMusic.play().then(() => {
    const el = document.getElementById("audioPrompt");
    if (el) el.remove();
    document.removeEventListener("pointerdown", retryAudioPrompt);
  }).catch(() => {});
}

/* ---------------- decorative venetian blind bars ----------------------*/
/* ---------------- micro-interactions -------------------------------------*/
const reducedMotion = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function animateCountUp(el, target, duration){
  if (reducedMotion() || !el){ if (el) el.textContent = target + (el.dataset.suffix || ""); return; }
  const start = performance.now();
  const suffix = el.dataset.suffix || "";
  function tick(now){
    const t = Math.min(1, (now - start) / duration);
    const eased = 1 - Math.pow(1 - t, 3);
    el.textContent = Math.round(target * eased) + suffix;
    if (t < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}
function initCountUps(container){
  (container || document).querySelectorAll(".count-up[data-target]").forEach(el => {
    const target = parseFloat(el.dataset.target);
    if (Number.isNaN(target)) return;
    animateCountUp(el, target, 900 + Math.random() * 300);
  });
}

function setupProgressiveReveal(container){
  if (reducedMotion()){
    (container || document).querySelectorAll(".section").forEach(s => s.classList.add("revealed"));
    return;
  }
  const sections = (container || document).querySelectorAll(".section");
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting){
        entry.target.classList.add("revealed");
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.08, rootMargin: "0px 0px -40px 0px" });
  sections.forEach(s => observer.observe(s));
}

function fireConfetti(){
  if (reducedMotion()) return;
  const colors = ["#A78BFA", "#7DD3FC", "#6EE7B7", "#FDBA74", "#FACC15"];
  const layer = document.createElement("div");
  layer.className = "confetti-layer";
  document.body.appendChild(layer);
  const count = 46;
  for (let i = 0; i < count; i++){
    const piece = document.createElement("span");
    piece.className = "confetti-piece";
    piece.style.left = (45 + Math.random() * 10) + "%";
    piece.style.background = colors[i % colors.length];
    piece.style.setProperty("--dx", (Math.random() * 2 - 1) * 220 + "px");
    piece.style.setProperty("--rot", (Math.random() * 720 - 360) + "deg");
    piece.style.animationDelay = (Math.random() * 0.15) + "s";
    piece.style.animationDuration = (1.1 + Math.random() * 0.6) + "s";
    layer.appendChild(piece);
  }
  setTimeout(() => layer.remove(), 2200);
}

/* ---------------- per-archetype accent theming ---------------------------
   Buttons, graphs, gradients and glows subtly shift to match the current
   person's own archetype colors on the result page, and reset to the
   default lavender/sky brand colors everywhere else. */
function setAccentColors(c1, c2){
  document.documentElement.style.setProperty("--user-accent-1", c1 || "#A78BFA");
  document.documentElement.style.setProperty("--user-accent-2", c2 || "#7DD3FC");
}

function spawnAmbience(){
  const layer = document.getElementById("embers");
  if (!layer || layer.dataset.done) return;
  layer.dataset.done = "1";
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduce) return;
  const orbColors = [
    "radial-gradient(circle, #A78BFA, transparent 70%)",
    "radial-gradient(circle, #7DD3FC, transparent 70%)",
    "radial-gradient(circle, #6EE7B7, transparent 70%)",
    "radial-gradient(circle, #FDBA74, transparent 70%)",
  ];
  const positions = [
    { left:"-10%", top:"-8%" },
    { left:"65%", top:"5%" },
    { left:"10%", top:"55%" },
    { left:"70%", top:"60%" },
  ];
  positions.forEach((pos, i) => {
    const orb = document.createElement("div");
    orb.className = "blind-bar";
    orb.style.left = pos.left;
    orb.style.top = pos.top;
    orb.style.background = orbColors[i % orbColors.length];
    orb.style.animationDuration = (16 + i * 3) + "s";
    orb.style.animationDelay = (i * 1.4) + "s";
    layer.appendChild(orb);
  });
}

function pickLines(n, sourcePool){
  const pool = [...(sourcePool || CALC_LINES)];
  const out = [];
  for (let i = 0; i < n && pool.length; i++){
    const idx = Math.floor(Math.random() * pool.length);
    out.push(pool.splice(idx, 1)[0]);
  }
  return out;
}

}

function topBar(showBack){

let navMenuOpen = false;
function toggleNavMenu(){
  navMenuOpen ? closeNavMenu() : openNavMenu();
}
function openNavMenu(){
  const menu = document.getElementById("navMenu");
  const btn = document.getElementById("navMenuBtn");
  const backdrop = document.getElementById("navMenuBackdrop");
  if (!menu || !btn) return;
  navMenuOpen = true;
  menu.hidden = false;
  if (backdrop) backdrop.hidden = false;
  requestAnimationFrame(() => { menu.classList.add("open"); if (backdrop) backdrop.classList.add("open"); });
  btn.setAttribute("aria-expanded", "true");
  btn.innerHTML = ICONS.close;
  document.addEventListener("pointerdown", onNavMenuOutsideClick, true);
  document.addEventListener("keydown", onNavMenuKey);
}
function closeNavMenu(){
  const menu = document.getElementById("navMenu");
  const btn = document.getElementById("navMenuBtn");
  const backdrop = document.getElementById("navMenuBackdrop");
  navMenuOpen = false;
  document.removeEventListener("pointerdown", onNavMenuOutsideClick, true);
  document.removeEventListener("keydown", onNavMenuKey);
  if (backdrop) backdrop.classList.remove("open");
  setTimeout(() => { if (!navMenuOpen && backdrop) backdrop.hidden = true; }, 400);
  if (!menu || !btn) return;
  menu.classList.remove("open");
  btn.setAttribute("aria-expanded", "false");
  btn.innerHTML = ICONS.menu;
  // Matches .nav-menu's longest close transition (grid-template-rows,
  // 550ms) so `hidden` lands right as the collapse finishes rather than
  // cutting it off mid-shrink.
  setTimeout(() => { if (!navMenuOpen && menu) menu.hidden = true; }, 550);
}
function onNavMenuOutsideClick(e){
  const menu = document.getElementById("navMenu");
  const btn = document.getElementById("navMenuBtn");
  if (!menu || (menu.contains(e.target) || (btn && btn.contains(e.target)))) return;
  closeNavMenu();
}
function onNavMenuKey(e){
  if (e.key !== "Escape") return;
  closeNavMenu();
  const btn = document.getElementById("navMenuBtn");
  if (btn) btn.focus();
}

/* ---------------- Toast + inert "coming soon" affordances --------------
   A couple of surfaces in the redesigned marketing shell (Sign Up, the
   optional-account panel) are intentionally not backed by any real
   account system yet, matching Forge's no-backend, no-accounts model.
   Rather than a dead click, they surface an honest, on-brand toast
   instead of the browser's native alert(). */
let toastTimer = null;
function showToast(message){
  let el = document.getElementById("toast");
  if (!el){
    el = document.createElement("div");
    el.id = "toast";
    el.className = "toast";
    el.setAttribute("role", "status");
    el.setAttribute("aria-live", "polite");
    document.body.appendChild(el);
  }
  el.textContent = message;
  el.classList.remove("show");
  void el.offsetWidth;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 3200);
}
function showComingSoon(feature){
  click(420);
  showToast(`${feature} aren't built yet — Forge stays fully on-device for now. Star the repo to hear when that changes.`);
}

/* ---------------- QUIZ PROGRESS PERSISTENCE ------------------------------
   Going home mid-quiz (or just closing the tab) never throws answers away.
   Progress is saved to localStorage and picked back up on the exact next
   unanswered question, not restarted from scratch. */
const QUIZ_PROGRESS_KEY = "pf_quiz_progress";
function saveQuizProgress(){
  if (!session || session.cursor <= 0 || session.isComplete()) return;
  try{ localStorage.setItem(QUIZ_PROGRESS_KEY, JSON.stringify(session.serialize())); }
  catch(e){ /* storage unavailable, skip silently */ }
}
function getSavedQuizProgress(){
  try{
    const raw = localStorage.getItem(QUIZ_PROGRESS_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch(e){ return null; }
}
function clearQuizProgress(){
  try{ localStorage.removeItem(QUIZ_PROGRESS_KEY); } catch(e){ /* ignore */ }
}
function resumeQuiz(){
  const saved = getSavedQuizProgress();
  if (!saved){ goToNameScreen(); return; }
  session = restoreQuizSession(saved);
  click(500);
  renderQuiz();
}
function discardSavedQuizAndStart(){
  clearQuizProgress();
  click(360);
  goToNameScreen();
}

/* Subtle magnetic pull on primary CTAs: the button nudges a few px
   toward the cursor within its own bounds, springing back on leave.
   Hover-capable pointers only, and a no-op under reduced motion.
   Clamped to +-8px regardless of button size: uncapped, the offset
   scaled with the button's own half-width (34px+ on a wide primary
   button), which visibly pushed it past its container's edge since a
   transform never reflows layout to make room for itself. */
const MAGNET_MAX_PX = 8;
function initMagneticButtons(container){
  if (reducedMotion() || !window.matchMedia("(hover: hover)").matches) return;
  (container || document).querySelectorAll(".btn-primary").forEach(btn => {
    let raf = null;
    btn.addEventListener("pointermove", (e) => {
      if (raf) return;
      raf = requestAnimationFrame(() => {
        raf = null;
        const rect = btn.getBoundingClientRect();
        const x = Math.max(-MAGNET_MAX_PX, Math.min(MAGNET_MAX_PX, (e.clientX - rect.left - rect.width / 2) * 0.25));
        const y = Math.max(-MAGNET_MAX_PX, Math.min(MAGNET_MAX_PX, (e.clientY - rect.top - rect.height / 2) * 0.35));
        btn.style.setProperty("--magnet-x", x.toFixed(1) + "px");
        btn.style.setProperty("--magnet-y", y.toFixed(1) + "px");
      });
    });
    btn.addEventListener("pointerleave", () => {
      btn.style.setProperty("--magnet-x", "0px");
      btn.style.setProperty("--magnet-y", "0px");
    });
  });
}

/* Subtle pointer-parallax on the hero's abstract shapes, each drifting a
   different amount so the stack reads as layered rather than flat. Pure
   ambient motion (no content moves), and skipped entirely under
   prefers-reduced-motion. */
function initHeroParallax(){
  const visual = document.querySelector(".lp-hero-visual");
  const photo = visual && visual.querySelector(".lp-hero-photo");
  if (!visual || !photo || reducedMotion() || !window.matchMedia("(hover: hover)").matches) return;
  let raf = null;
  visual.addEventListener("pointermove", (e) => {
    if (raf) return;
    raf = requestAnimationFrame(() => {
      raf = null;
      const rect = visual.getBoundingClientRect();
      const px = (e.clientX - rect.left) / rect.width - 0.5;
      const py = (e.clientY - rect.top) / rect.height - 0.5;
      photo.style.setProperty("--px", (px * 14).toFixed(2) + "px");
      photo.style.setProperty("--py", (py * 14).toFixed(2) + "px");
    });
  });
  visual.addEventListener("pointerleave", () => {
    photo.style.setProperty("--px", "0px");
    photo.style.setProperty("--py", "0px");
  });
}

      </div>

        <div class="quiz-nav-row">

          <div class="q-num">SCENARIO ${String(current + 1).padStart(2,"0")}</div>
          <span></span>
        </div>
        <div class="q-text">${q.text}</div>
        <div class="options" role="listbox" aria-label="Answer options">
          ${q.options.map((opt, i) => `
            <button class="option ${existing && existing.optionIndex === i ? "selected" : ""}" role="option" onclick="selectOption(${i})">
              <span class="opt-key">${String.fromCharCode(65+i)}</span>
              <span>${opt.text}</span>
            </button>`).join("")}
        </div>
        ${existing ? `<div class="continue-row"><button class="btn btn-ghost" onclick="continueForward()">Keep this answer, continue &rarr;</button></div>` : ""}

function attachKeyHandler(){
  document.onkeydown = (e) => {
    if (["1","2","3"].includes(e.key)){
      const idx = parseInt(e.key, 10) - 1;
      const opts = document.querySelectorAll(".option");
      if (opts[idx]) selectOption(idx);
    } else if (e.key === "ArrowLeft" && session.canGoBack()){
      goBackQuestion();
    } else if (e.key === "ArrowRight" && session.canSkipForward()){
      continueForward();
    }
  };
}

function goBackQuestion(){
  click(300);
  session.goBack();
  renderQuiz();
}
function continueForward(){
  click(460);
  session.goForward();
  if (session.isComplete()) renderForging();
  else renderQuiz();
}

function selectOption(idx){
  const opts = document.querySelectorAll(".option");
  opts.forEach(o => o.classList.remove("selected"));
  if (opts[idx]) opts[idx].classList.add("selected");
  click(420 + idx * 60);
  session.answer(idx);
  saveQuizProgress();
  const card = document.getElementById("qcard");
  if (card) card.classList.add("leaving");
  showCalcOverlay(1, () => {
    if (session.isComplete()) renderForging();
    else renderQuiz();
  });
}

function showCalcOverlay(count, done){
  document.onkeydown = null;
  const overlay = document.createElement("div");
  overlay.className = "calc-overlay";
  const line = pickLines(1)[0] || "Processing";
  overlay.innerHTML = `<div class="calc-bars"><span></span><span></span><span></span><span></span></div><div class="calc-line">${line}...</div>`;
  document.body.appendChild(overlay);
  setTimeout(() => {
    overlay.remove();
    done();
  }, 480);
}

function computeResult(){
  const normDims = session.normalizedDims();
  const match = matchArchetype(normDims);
  const code = encodeCode(match.primary.id, normDims, session.name);
  lastResult = {
    name: session.name || "",
    meta: session.meta || {},
    normDims,
    archetype: match.primary,
    runnerUp: match.runnerUp,
    ranked: match.ranked,
    subProfile: computeSubProfile(normDims, match.primary),
    code,
    careers: computeCareers(normDims),
    relationships: computeRelationshipStyles(normDims),
    traits: computeMeasuredTraits(normDims),
    consistency: computeConsistency(session),
    upgradedFromV1: false,
    ...buildProfileExtras(normDims, match.primary, match.ranked, session, false),
  };
  localStorage.setItem("pf_last_code", code);
  saveToTimeline(lastResult);
  clearQuizProgress();
  careersExpanded = false;
}

/* ---------------- TIMELINE -----------------------------------
   Since there's no backend, "history" just means a small local log kept in
   localStorage on this device: each completed result, versioned and
   timestamped. On a retake, the newest run is compared against the most
   recent previous entry so the person can see roughly what shifted. */
function saveToTimeline(result){
  try{
    const history = JSON.parse(localStorage.getItem("pf_history") || "[]");
    history.push({
      code: result.code,
      name: result.name,
      archetype: result.archetype.name,
      normDims: result.normDims,
      traits: result.traits,
      timestamp: Date.now(),
      version: CODE_VERSION,
    });
    while (history.length > 10) history.shift();
    localStorage.setItem("pf_history", JSON.stringify(history));
  } catch(e){ /* storage unavailable, skip silently */ }
}
function getPreviousTimelineEntry(){
  try{
    const history = JSON.parse(localStorage.getItem("pf_history") || "[]");
    return history.length >= 2 ? history[history.length - 2] : null;
  } catch(e){ return null; }
}

function buildResultFromDecoded(decoded, code){
  const normDims = decoded.normDims;
  const match = matchArchetype(normDims);
  return {
    name: decoded.name || "",
    meta: {},
    normDims,
    archetype: decoded.archetype,
    runnerUp: match.runnerUp,
    ranked: match.ranked,
    subProfile: computeSubProfile(normDims, decoded.archetype),
    code,
    careers: computeCareers(normDims),
    relationships: computeRelationshipStyles(normDims),
    traits: computeMeasuredTraits(normDims),
    consistency: null,
    ...buildProfileExtras(normDims, decoded.archetype, match.ranked, null, !!decoded.upgraded),
    upgradedFromV1: !!decoded.upgraded,
    decodedProfile: decoded,
  };
}

/* ---------------- Radar chart (canvas, no library) ---------------------*/
function hexToRgba(hex, alpha){
  const h = (hex || "#A78BFA").replace("#","");
  const full = h.length === 3 ? h.split("").map(c=>c+c).join("") : h;
  const r = parseInt(full.substring(0,2),16) || 0;
  const g = parseInt(full.substring(2,4),16) || 0;
  const b = parseInt(full.substring(4,6),16) || 0;
  return `rgba(${r},${g},${b},${alpha})`;
}

function drawRadar(canvas, normDims, accentColor){
  if (!canvas) return;
  const ctx = canvas.getContext("2d");
  const dpr = window.devicePixelRatio || 1;
  const dims = DIMENSIONS;
  const n = dims.length;
  const labels = dims.map(d => RADAR_LABELS[d] || d);
  const color = accentColor || "#A78BFA";

  // Measure the widest label at the font size we intend to use, so the
  // margin is always exactly as big as it needs to be, on any screen.
  const fontSize = Math.max(9, Math.min(11, root.clientWidth / 42));
  ctx.font = `${fontSize}px Manrope, sans-serif`;
  let maxLabelWidth = 0;
  labels.forEach(l => { maxLabelWidth = Math.max(maxLabelWidth, ctx.measureText(l).width); });

  const available = Math.min(560, root.clientWidth - 24);
  const margin = Math.min(available * 0.34, maxLabelWidth + 22);
  const size = available;
  canvas.width = size * dpr; canvas.height = size * dpr;
  canvas.style.width = size + "px"; canvas.style.height = size + "px";
  ctx.scale(dpr, dpr);
  const cx = size/2, cy = size/2, R = Math.max(60, size/2 - margin);
  ctx.clearRect(0,0,size,size);

  const isLight = document.documentElement.dataset.theme === "light";
  const gridColor = isLight ? "rgba(15,23,42,0.10)" : "rgba(255,255,255,0.08)";
  const spokeColor = isLight ? "rgba(15,23,42,0.07)" : "rgba(255,255,255,0.06)";
  const labelColor = isLight ? "rgba(15,23,42,0.68)" : "rgba(248,250,252,0.62)";
  const dotColor = isLight ? "#0F172A" : "#F8FAFC";

  ctx.strokeStyle = gridColor;
  ctx.lineWidth = 1;
  for (let ring = 1; ring <= 4; ring++){
    ctx.beginPath();
    for (let i = 0; i <= n; i++){
      const angle = (i / n) * Math.PI * 2 - Math.PI/2;
      const r = (R * ring)/4;
      const x = cx + Math.cos(angle) * r, y = cy + Math.sin(angle) * r;
      i === 0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
    }
    ctx.stroke();
  }
  ctx.fillStyle = labelColor;
  ctx.font = `${fontSize}px Manrope, sans-serif`;
  ctx.textBaseline = "middle";
  dims.forEach((d, i) => {
    const angle = (i / n) * Math.PI * 2 - Math.PI/2;
    const x = cx + Math.cos(angle) * R, y = cy + Math.sin(angle) * R;
    ctx.strokeStyle = spokeColor;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(x,y); ctx.stroke();
    const cosA = Math.cos(angle);
    const lx = cx + cosA * (R + 14), ly = cy + Math.sin(angle) * (R + 14);
    ctx.textAlign = cosA > 0.15 ? "left" : cosA < -0.15 ? "right" : "center";
    ctx.fillText(labels[i], lx, ly);
  });

  // The data polygon draws itself: growing outward from the center over
  // ~750ms instead of appearing instantly, so the personality visibly
  // emerges rather than just showing up.
  const drawPolygon = (progress) => {
    ctx.save();
    ctx.beginPath();
    dims.forEach((d, i) => {
      const angle = (i / n) * Math.PI * 2 - Math.PI/2;
      const val = Math.max(0, Math.min(1, (normDims[d] + 10) / 20)) * progress;
      const r = R * val;
      const x = cx + Math.cos(angle) * r, y = cy + Math.sin(angle) * r;
      i === 0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
    });
    ctx.closePath();
    ctx.fillStyle = hexToRgba(color, 0.18 * progress);
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.8;
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = dotColor;
    dims.forEach((d, i) => {
      const angle = (i / n) * Math.PI * 2 - Math.PI/2;
      const val = Math.max(0, Math.min(1, (normDims[d] + 10) / 20)) * progress;
      const r = R * val;
      const x = cx + Math.cos(angle) * r, y = cy + Math.sin(angle) * r;
      ctx.beginPath(); ctx.arc(x, y, 2, 0, Math.PI*2); ctx.fill();
    });
    ctx.restore();
  };

  if (reducedMotion()){
    drawPolygon(1);
    return;
  }
  const start = performance.now();
  const duration = 750;
  function tick(now){
    const t = Math.min(1, (now - start) / duration);
    const eased = 1 - Math.pow(1 - t, 3);
    ctx.clearRect(0,0,size,size);
    ctx.strokeStyle = gridColor;
    ctx.lineWidth = 1;
    for (let ring = 1; ring <= 4; ring++){
      ctx.beginPath();
      for (let i = 0; i <= n; i++){
        const angle = (i / n) * Math.PI * 2 - Math.PI/2;
        const r = (R * ring)/4;
        const x = cx + Math.cos(angle) * r, y = cy + Math.sin(angle) * r;
        i === 0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
      }
      ctx.stroke();
    }
    ctx.fillStyle = labelColor;
    ctx.font = `${fontSize}px Manrope, sans-serif`;
    ctx.textBaseline = "middle";
    dims.forEach((d, i) => {
      const angle = (i / n) * Math.PI * 2 - Math.PI/2;
      const x = cx + Math.cos(angle) * R, y = cy + Math.sin(angle) * R;
      ctx.strokeStyle = spokeColor;
      ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(x,y); ctx.stroke();
      const cosA = Math.cos(angle);
      const lx = cx + cosA * (R + 14), ly = cy + Math.sin(angle) * (R + 14);
      ctx.textAlign = cosA > 0.15 ? "left" : cosA < -0.15 ? "right" : "center";
      ctx.fillText(labels[i], lx, ly);
    });
    drawPolygon(eased);
    if (t < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

/* ---------------- Seven Sins / Heavenly Virtues (fun, flippable) ---------
   Same 7 axes, same underlying percentages, just read from the sin side
   or the virtue side (100 - the other). Flipping morphs the polygon from
   its current shape to the new one instead of snapping, since the whole
   point is that it's the same evidence seen differently, not a new
   chart. Respects prefers-reduced-motion (snaps instantly instead). */
let sinVirtueMode = "sin";
function drawSinVirtueRadar(canvas, axes, mode, accentColor, fromValues){
  if (!canvas) return;
  const ctx = canvas.getContext("2d");
  const dpr = window.devicePixelRatio || 1;
  const n = axes.length;
  const values = axes.map(a => mode === "sin" ? a.sinPct : a.virtuePct);
  const labels = axes.map(a => mode === "sin" ? a.sinLabel : a.virtueLabel);
  const color = accentColor || "#A78BFA";
  const isLight = document.documentElement.dataset.theme === "light";
  const gridColor = isLight ? "rgba(15,23,42,0.10)" : "rgba(255,255,255,0.08)";
  const labelColor = isLight ? "rgba(15,23,42,0.72)" : "rgba(248,250,252,0.68)";

  const available = Math.min(340, root.clientWidth - 24);
  const size = available;
  canvas.width = size * dpr; canvas.height = size * dpr;
  canvas.style.width = size + "px"; canvas.style.height = size + "px";
  ctx.scale(dpr, dpr);
  const cx = size/2, cy = size/2, R = size/2 - 54;

  function frame(currentValues){
    ctx.clearRect(0,0,size,size);
    ctx.strokeStyle = gridColor; ctx.lineWidth = 1;
    for (let ring = 1; ring <= 4; ring++){
      ctx.beginPath();
      for (let i = 0; i <= n; i++){
        const angle = (i/n) * Math.PI*2 - Math.PI/2;
        const r = (R*ring)/4;
        const x = cx + Math.cos(angle)*r, y = cy + Math.sin(angle)*r;
        i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
      }
      ctx.stroke();
    }
    ctx.fillStyle = labelColor;
    ctx.font = "12px Manrope, sans-serif";
    ctx.textBaseline = "middle";
    axes.forEach((a,i) => {
      const angle = (i/n) * Math.PI*2 - Math.PI/2;
      const x = cx + Math.cos(angle)*R, y = cy + Math.sin(angle)*R;
      ctx.strokeStyle = gridColor;
      ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(x,y); ctx.stroke();
      const cosA = Math.cos(angle);
      const lx = cx + cosA*(R+16), ly = cy + Math.sin(angle)*(R+16);
      ctx.textAlign = cosA > 0.15 ? "left" : cosA < -0.15 ? "right" : "center";
      ctx.fillText(labels[i], lx, ly);
    });
    ctx.beginPath();
    axes.forEach((a,i) => {
      const angle = (i/n) * Math.PI*2 - Math.PI/2;
      const r = R * Math.max(0, Math.min(1, currentValues[i]/100));
      const x = cx + Math.cos(angle)*r, y = cy + Math.sin(angle)*r;
      i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
    });
    ctx.closePath();
    ctx.fillStyle = hexToRgba(color, 0.2);
    ctx.strokeStyle = color; ctx.lineWidth = 1.8;
    ctx.fill(); ctx.stroke();
  }

  if (reducedMotion() || !fromValues){ frame(values); return; }
  const start = performance.now(), duration = 550;
  function tick(now){
    const t = Math.min(1, (now-start)/duration);
    const eased = 1 - Math.pow(1-t, 3);
    const current = values.map((v,i) => fromValues[i] + (v - fromValues[i]) * eased);
    frame(current);
    if (t < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}
function flipSinVirtue(){
  const r = lastResult;
  if (!r || !r.sinVirtue) return;
  const fromValues = r.sinVirtue.map(a => sinVirtueMode === "sin" ? a.sinPct : a.virtuePct);
  sinVirtueMode = sinVirtueMode === "sin" ? "virtue" : "sin";
  click(sinVirtueMode === "virtue" ? 660 : 330);
  drawSinVirtueRadar(document.getElementById("sinVirtueRadar"), r.sinVirtue, sinVirtueMode, r.archetype.colors[0], fromValues);
  const caption = document.getElementById("sinVirtueCaption");
  if (caption) caption.textContent = sinVirtueMode === "sin" ? "Seven Deadly Sins" : "Seven Heavenly Virtues";
}

/* ---------------- PNG export (canvas render of a share card) -----------*/
function exportPNG(kind){
  const r = lastResult; const a = r.archetype;
  const dims = kind === "story" ? { w: 1080, h: 1920 } : { w: 1080, h: 1350 };
  const canvas = document.createElement("canvas");
  canvas.width = dims.w; canvas.height = dims.h;
  const ctx = canvas.getContext("2d");

  ctx.fillStyle = "#0F1117";
  ctx.fillRect(0,0,dims.w,dims.h);
  const glow = ctx.createRadialGradient(dims.w/2, dims.h*0.22, 40, dims.w/2, dims.h*0.22, dims.w*0.7);
  glow.addColorStop(0, hexToRgba(a.colors[0], 0.22)); glow.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = glow; ctx.fillRect(0,0,dims.w,dims.h);
  const glow2 = ctx.createRadialGradient(dims.w*0.85, dims.h*0.75, 40, dims.w*0.85, dims.h*0.75, dims.w*0.6);
  glow2.addColorStop(0, hexToRgba(a.colors[1], 0.14)); glow2.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = glow2; ctx.fillRect(0,0,dims.w,dims.h);

  ctx.textAlign = "center";
  ctx.fillStyle = "#A7B0C2";
  ctx.font = "600 26px 'Space Grotesk', sans-serif";
  ctx.fillText("FORGE", dims.w/2, dims.h*0.12);

  if (r.name){
    ctx.font = "500 30px 'JetBrains Mono', monospace";
    ctx.fillStyle = "#F8FAFC";
    ctx.fillText(r.name.toUpperCase(), dims.w/2, dims.h*0.18);
  }

  ctx.font = "700 90px 'Space Grotesk', sans-serif";
  ctx.fillStyle = "#F8FAFC";
  ctx.fillText(a.icon, dims.w/2, dims.h*0.30);

  ctx.font = "700 60px 'Space Grotesk', sans-serif";
  ctx.fillStyle = "#F8FAFC";
  wrapText(ctx, a.name, dims.w/2, dims.h*0.38, dims.w*0.85, 66);

  ctx.font = "italic 400 28px 'Manrope', sans-serif";
  ctx.fillStyle = a.colors[0];
  ctx.fillText(a.title, dims.w/2, dims.h*0.44);

  ctx.font = "400 26px 'Manrope', sans-serif";
  ctx.fillStyle = "#CBD5E1";
  wrapText(ctx, a.description, dims.w/2, dims.h*0.52, dims.w*0.78, 38);

  const topTraits = Object.entries(r.traits).sort((x,y)=>y[1]-x[1]).slice(0,3);
  const statY = dims.h*0.7;
  const spacing = dims.w/4;
  const statColors = [a.colors[0], a.colors[1], "#A7B0C2"];
  topTraits.forEach(([k,v], i) => {
    const x = dims.w/2 + (i-1)*spacing;
    ctx.font = "700 50px 'Space Grotesk', sans-serif"; ctx.fillStyle = statColors[i] || "#F8FAFC";
    ctx.fillText(v, x, statY);
    ctx.font = "400 18px 'Manrope', sans-serif"; ctx.fillStyle = "#A7B0C2";
    wrapText(ctx, k, x, statY + 30, spacing - 10, 20);
  });

  ctx.font = "400 22px 'JetBrains Mono', monospace";
  ctx.fillStyle = "#6B7385";
  ctx.fillText(r.code, dims.w/2, dims.h*0.95);
  ctx.font = "400 18px 'Manrope', sans-serif";
  ctx.fillStyle = "#4B5163";
  ctx.fillText("Generated with Forge", dims.w/2, dims.h*0.975);

  const link = document.createElement("a");
  link.download = `forge-${kind}.png`;
  link.href = canvas.toDataURL("image/png");
  link.click();
  click(760);
}
function wrapText(ctx, text, x, y, maxWidth, lineHeight){
  const words = String(text).split(" ");
  let line = "", lines = [];
  words.forEach(w => {
    const test = line + w + " ";
    if (ctx.measureText(test).width > maxWidth && line){ lines.push(line); line = w + " "; }
    else line = test;
  });
  lines.push(line);
  const startY = y - ((lines.length-1)*lineHeight)/2;
  lines.forEach((l,i) => ctx.fillText(l.trim(), x, startY + i*lineHeight));
}

/* ---------------- shareable profile links --------------------------------
   The QR already encodes a URL with ?code=..., but until now nothing on
   load ever read that parameter back out, so scanning it just opened a
   blank landing page. This closes that loop: on boot, and whenever a
   result is shown, the address bar carries the code, so the QR, a copied
   link, and the browser's own URL bar are all the same shareable thing.
   Query-param format (?code=...) is the primary, fully-supported form
   since it works on any static host with zero extra setup. A trailing
   path segment that looks like a code (e.g. /PersonaForge/Yota-PF2-...)
   is also read as a best-effort fallback, but actually serving that path
   on GitHub Pages needs a 404->index.html redirect set up in the repo;
   without it, only the ?code= form will reach the app at all. */
function getProfileCodeFromURL(){
  const params = new URLSearchParams(location.search);
  const fromQuery = params.get("code");
  if (fromQuery) return decodeURIComponent(fromQuery);
  const segments = location.pathname.split("/").filter(Boolean);
  const last = segments[segments.length - 1] || "";
  if (/-PF[12]-/.test(last)) return decodeURIComponent(last);
  return null;
}

function setShareableURL(code){
  if (!code || !window.history || !history.pushState) return;
  const url = new URL(location.href);
  url.search = "";
  url.searchParams.set("code", code);
  history.pushState({ code }, "", url.toString());
}

function clearShareableURL(){
  if (!window.history || !history.pushState) return;
  const url = new URL(location.href);
  url.search = "";
  history.pushState({}, "", url.toString());
}

let pendingSharedCode = null;
let pendingSharedProfile = null;

function tryLoadProfileFromURL(){
  const code = getProfileCodeFromURL();
  if (!code) return false;
  const decoded = decodeCode(code);
  if (!decoded) return false;
  pendingSharedCode = code;
  pendingSharedProfile = decoded;
  renderSharedLinkInterstitial();
  return true;
}

/* Opening a shared link no longer jumps straight into someone else's
   result. It's their profile, not the visitor's, so a brief interstitial
   asks what the visitor actually wants to do with it first. */
function renderSharedLinkInterstitial(){
  const decoded = pendingSharedProfile;
  const a = decoded.archetype;
  setAccentColors(a.colors[0], a.colors[1]);
  setPageTitle(decoded.name ? `${decoded.name}'s Profile` : "Shared Profile");
  const hasOwnProfile = !!localStorage.getItem("pf_last_code");
  const whoShared = decoded.name ? `${decoded.name} shared their Forge profile.` : "Someone shared their Forge profile.";
  root.innerHTML = `

          <button class="btn btn-ghost" onclick="takeAssessmentFromShared()">Take the Assessment</button>
        </div>
      </div>
    </div>
  `;
}

/* click ripple for every .btn, via delegation since buttons are
   re-created on every render rather than persisting in the DOM */
document.addEventListener("pointerdown", (e) => {
  const btn = e.target.closest(".btn");
  if (!btn || reducedMotion()) return;
  const rect = btn.getBoundingClientRect();
  const size = Math.max(rect.width, rect.height);
  const ripple = document.createElement("span");
  ripple.className = "ripple";
  ripple.style.width = ripple.style.height = size + "px";
  ripple.style.left = (e.clientX - rect.left - size/2) + "px";
  ripple.style.top = (e.clientY - rect.top - size/2) + "px";
  btn.appendChild(ripple);
  setTimeout(() => ripple.remove(), 650);
});
