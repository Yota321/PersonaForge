<body>
<div id="embers" aria-hidden="true"></div>
<div id="app"></div>
<audio id="bgMusic" src="assets/BG.mp3" loop preload="auto"></audio>
<!-- Premium scrollbar overlay: purely a visual/drag affordance layered on
     top of real scrolling, never a replacement for it — aria-hidden so
     assistive tech never sees it, and it lives outside #app (like
     #embers/#bgMusic above) so an SPA screen change never tears it down.
     See the SCROLLBAR script block near the end of body. -->
<div class="scrollbar-rail" id="sbRail" aria-hidden="true">
  <div class="scrollbar-track" id="sbTrack"></div>
  <div class="scrollbar-thumb" id="sbThumb"></div>
</div>

<script src="js/engine.js"></script>
<script src="js/global.js"></script>
<script src="js/home.js"></script>
<script>
const PF_PAGE = "index";
applyTheme(currentTheme);
window.addEventListener("popstate", () => {
  if (!tryLoadProfileFromURL()) renderLanding();
});
if (!tryLoadProfileFromURL()) renderLanding();
</script>
</body>
